<!DOCTYPE html>

<style>
/* 全局样式重置+基础布局 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", Arial, sans-serif;
}
body {
  background: #f5f7fa;
  padding: 24px;
  min-width: 1200px; /* 避免窄屏布局错乱 */
}
.container {
  max-width: 1400px;
  margin: 0 auto;
}
/* 头部样式 */
header {
  background: #165DFF;
  color: #fff;
  padding: 28px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 24px;
}
header h1 {
  font-size: 24px;
  margin-bottom: 8px;
  line-height: 1.4; /* 适配文字换行 */
}
header p {
  opacity: 0.9;
  font-size: 14px;
}
/* 卡片样式 */
.card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  min-height: 120px; /* 避免内容为空时卡片塌陷 */
}
/* 查询表单样式 */
.form {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
select, input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 14px;
  min-width: 200px;
}
button {
  background: #165DFF;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}
button:hover {
  background: #0F52CC;
}
button:disabled {
  background: #8CB4FF;
  cursor: not-allowed;
}
/* 网格布局 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
  /* 强制显示网格，避免内容丢失 */
  display: grid !important;
  opacity: 1 !important;
}
.full {
  grid-column: 1 / -1;
}
/* 数据项样式 */
.item {
  padding: 14px;
  background: #f5f7fa;
  border-radius: 10px;
  margin: 10px 0;
  min-height: 80px; /* 避免内容为空时塌陷 */
}
/* 关键修改：item下所有div默认粗体，保持样式统一 */
.item div {
  font-size: 15px;
  line-height: 1.8;
  font-weight: bold; /* 新增：默认粗体 */
}
.item strong {
  font-size: 16px;
  font-weight: bold; /* 强化粗体，确保一致性 */
}
/* 加载状态 */
.loading {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 16px;
}
/* 图表容器（核心修复：解决渲染异常） */
.chart-container {
  position: relative;
  height: 500px;
  width: 100%;
  margin: 0 auto;
  padding: 20px; /* 增加内边距，避免内容溢出 */
  min-height: 500px; /* 强制高度，避免渲染异常 */
}
/* 隐藏元素的正确方式 */
.hidden {
  display: none !important;
}
</style>
</head>

<script>
// 状态配置
const STATE_CONFIG = {
  Ohio: { population:11700000, csvFileName:"ohio_data.csv", ruralRatio:0.2 },
  Alabama: { population:5024279, csvFileName:"Alabama_data.csv", ruralRatio:0.35 },
  Alaska: { population:733583, csvFileName:"Alaska_data.csv", ruralRatio:0.65 },
  Arizona: { population:7379654, csvFileName:"Arizona_data.csv", ruralRatio:0.28 },

  California: { population:39538223, csvFileName:"California_data.csv", ruralRatio:0.15 },

  Connecticut: { population:3605944, csvFileName:"Connecticut_data.csv", ruralRatio:0.18 },

  Florida: { population:21538187, csvFileName:"Florida_data.csv", ruralRatio:0.14 },
  Georgia: { population:10711908, csvFileName:"Georgia_data.csv", ruralRatio:0.24 },
  Hawaii: { population:1455271, csvFileName:"Hawaii_data.csv", ruralRatio:0.21 },
  Idaho: { population:1900923, csvFileName:"Idaho_data.csv", ruralRatio:0.58 },
  Illinois: { population:12812508, csvFileName:"Illinois_data.csv", ruralRatio:0.19 },

  Kentucky: { population:4509342, csvFileName:"Kentucky_data.csv", ruralRatio:0.41 },
  Louisiana: { population:4657757, csvFileName:"Louisiana_data.csv", ruralRatio:0.34 },
  Maine: { population:1372247, csvFileName:"Maine_data.csv", ruralRatio:0.61 },
  Maryland: { population:6177224, csvFileName:"Maryland_data.csv", ruralRatio:0.17 },
  Massachusetts: { population:7029917, csvFileName:"Massachusetts_data.csv", ruralRatio:0.13 },
  Michigan: { population:10077331, csvFileName:"Michigan_data.csv", ruralRatio:0.29 },
  Minnesota: { population:5707390, csvFileName:"Minnesota_data.csv", ruralRatio:0.40 },
  Mississippi: { population:2966407, csvFileName:"Mississippi_data.csv", ruralRatio:0.49 },
  Missouri: { population:6169270, csvFileName:"Missouri_data.csv", ruralRatio:0.36 },
  Montana: { population:1122867, csvFileName:"Montana_data.csv", ruralRatio:0.69 },
  Nebraska: { population:1963692, csvFileName:"Nebraska_data.csv", ruralRatio:0.53 },
  Nevada: { population:3104614, csvFileName:"Nevada_data.csv", ruralRatio:0.33 },
  Oklahoma: { population:3959353, csvFileName:"Oklahoma_data.csv", ruralRatio:0.43 },
  Oregon: { population:4237256, csvFileName:"Oregon_data.csv", ruralRatio:0.39 },
  Pennsylvania: { population:12801989, csvFileName:"Pennsylvania_data.csv", ruralRatio:0.21 },
  Tennessee: { population:6910840, csvFileName:"Tennessee_data.csv", ruralRatio:0.30 },
  Texas: { population:29145505, csvFileName:"Texas_data.csv", ruralRatio:0.18 },
  Utah: { population:3380800, csvFileName:"Utah_data.csv", ruralRatio:0.35 },
  Vermont: { population:643077, csvFileName:"Vermont_data.csv", ruralRatio:0.56 },
  Virginia: { population:8631393, csvFileName:"Virginia_data.csv", ruralRatio:0.23 },
  Washington: { population:7705281, csvFileName:"Washington_data.csv", ruralRatio:0.25 },
  Wisconsin: { population:5893718, csvFileName:"Wisconsin_data.csv", ruralRatio:0.37 },
  Wyoming: { population:578803, csvFileName:"Wyoming_data.csv", ruralRatio:0.72 },
  NewHampshire: { population:1388992, csvFileName:"NewHampshire_data.csv", ruralRatio:0.42 },
  NewJersey: { population:9288994, csvFileName:"NewJersey_data.csv", ruralRatio:0.11 },
  NewMexico: { population:2117522, csvFileName:"NewMexico_data.csv", ruralRatio:0.54 },
  NewYork: { population:20201249, csvFileName:"NewYork_data.csv", ruralRatio:0.12 },
  NorthCarolina: { population:10439388, csvFileName:"NorthCarolina_data.csv", ruralRatio:0.26 },
  NorthDakota: { population:779261, csvFileName:"NorthDakota_data.csv", ruralRatio:0.63 },
  RhodeIsland: { population:1097379, csvFileName:"RhodeIsland_data.csv", ruralRatio:0.20 },
  SouthCarolina: { population:5210095, csvFileName:"SouthCarolina_data.csv", ruralRatio:0.27 },
  SouthDakota: { population:909824, csvFileName:"SouthDakota_data.csv", ruralRatio:0.62 },
  WestVirginia: { population:1782959, csvFileName:"WestVirginia_data.csv", ruralRatio:0.51 },
  DistrictOfColumbia: { population:712816, csvFileName:"districtofcolumbia_data.csv", ruralRatio:0 }
};

const COMMON_PARAMS = { 
  gamma:0.2, 
  smoothWindow:7, 
  reWarnThreshold:1.2, 
  growthWarnThreshold:0.3, 
  ruralUrbanRatio:0.77 
};

// 全局变量初始化（赋默认值，避免undefined）
let currentState = "Ohio";
let rawData = [];
let calcData = [];
let fullData = [];
let chart = null;
let csvMinDate = "";
let csvMaxDate = "";

// 工具函数：日期格式化（修复时区问题）
function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  // 强制使用本地时间，避免UTC偏移
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// 工具函数：生成日期范围
function generateDateRange(startDate, endDate) {
  const dates = [];
  let currentDate = new Date(startDate);
  const finalDate = new Date(endDate);
  
  while (currentDate <= finalDate) {
    dates.push(formatDate(currentDate));
    currentDate.setDate(currentDate.getDate() + 1);
  }
  return dates;
}

// 核心：补全数据至今日（增加容错）
function completeDataToToday() {
  try {
    const todayStr = getTodayDate();
    const csvLastDate = new Date(csvMaxDate);
    const today = new Date(todayStr);
    
    if (csvLastDate >= today) {
      fullData = [...calcData];
      return;
    }

    const fillDates = generateDateRange(
      new Date(csvLastDate).setDate(csvLastDate.getDate() + 1), 
      today
    );
    const lastValidData = calcData[calcData.length - 1] || {
      Re: 1.0,
      newRaw: 100,
      newSmooth: 100,
      S: STATE_CONFIG[currentState].population * 0.9,
      I: 1000,
      beta: 0.2,
      N: STATE_CONFIG[currentState].population
    };

    let currentRe = lastValidData.Re;
    const trendDirection = Math.random() > 0.5 ? 1 : -1;
    const trendStrength = Math.random() * 0.0015;
    let segmentDay = 0;
    let segmentTrend = trendDirection;

    const fillData = fillDates.map((date, index) => {
      if (segmentDay >= 30) {
        segmentTrend = Math.random() > 0.5 ? 1 : -1;
        segmentDay = 0;
      }
      segmentDay++;

      currentRe += segmentTrend * trendStrength;
      const randomFluc = (Math.random() - 0.5) * (0.02 + Math.random() * 0.03);
      currentRe = Math.max(0.1, Math.min(2, currentRe + randomFluc));
      
      return {
        date: date,
        newRaw: lastValidData.newRaw * (0.95 + Math.random() * 0.1),
        newSmooth: lastValidData.newSmooth * (0.95 + Math.random() * 0.1),
        S: Math.max(0, lastValidData.S - Math.random() * 1000),
        I: Math.max(0, lastValidData.I + (Math.random() - 0.5) * 500),
        beta: lastValidData.beta * (0.98 + Math.random() * 0.04),
        Rt: currentRe * lastValidData.N / lastValidData.S,
        Re: currentRe
      };
    });

    fullData = [...calcData, ...fillData];
  } catch (e) {
    console.error("补全数据失败：", e);
    // 降级处理：使用原始数据
    fullData = [...calcData];
  }
}

// 加载州数据（核心修复：增加加载状态、容错、时序控制）
function loadStateData() {
  currentState = document.getElementById("stateSel").value;
  const stateInfo = STATE_CONFIG[currentState];
  if (!stateInfo) {
    alert("所选州无配置信息 / No config for selected state");
    return;
  }
  const csvFile = stateInfo.csvFileName;

  // 显示加载状态
  const loadingEl = document.getElementById("loading");
  const resultContainer = document.getElementById("resultContainer");
  loadingEl.style.display = "block";
  // 重置数据卡片提示
  document.getElementById("resToday").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resForecast").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resUrban").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resUAV").innerHTML = "<div>加载中... / Loading...</div>";

  // 禁用查询控件
  document.getElementById("dateSel").value = "";
  document.getElementById("dateSel").disabled = true;
  document.querySelector("button").disabled = true;
  document.getElementById("dateRangeText").textContent = "数据日期范围 Data Range：加载中... Loading...";

  // 加载CSV数据（增加超时处理）
  const loadTimeout = setTimeout(() => {
    alert("数据加载超时 / Data load timeout");
    loadingEl.style.display = "none";
  }, 15000);

  Papa.parse(csvFile, { 
    download: true, 
    header: true, 
    skipEmptyLines: true,
    complete: (r) => {
      clearTimeout(loadTimeout); // 清除超时
      try {
        // 过滤有效数据
        const validData = r.data.filter(x => 
          x.date && x.cases && !isNaN(+x.cases)
        ).map(x => ({
          date: formatDate(x.date),
          totalCases: +x.cases
        })).sort((a, b) => new Date(a.date) - new Date(b.date));

        if (validData.length === 0) {
          throw new Error("无有效数据 / No valid data");
        }

        rawData = validData;
        calculateData();
        completeDataToToday();
        setDateRange();
        // 延迟初始化图表，确保DOM加载完成
        setTimeout(() => {
          initChart();
          runQuery();
          loadingEl.style.display = "none";
        }, 300);

      } catch (e) {
        console.error("处理数据失败：", e);
        alert(`${currentState} 数据处理失败 / Data process failed：${e.message}，自动切回Ohio州`);
        document.getElementById("stateSel").value = "Ohio";
        loadStateData();
      }
    },
    error: (err) => {
      clearTimeout(loadTimeout);
      console.error("加载CSV失败：", err);
      alert(`${currentState} 文件加载失败 / File load failed，自动切回Ohio州`);
      document.getElementById("stateSel").value = "Ohio";
      loadStateData();
    }
  });
}

// 计算Re指数（增加容错）
function calculateData() {
  try {
    const N = STATE_CONFIG[currentState].population;
    let S = N, I = 0;
    const dailyRaw = rawData.map((r, i) => ({
      date: r.date,
      newRaw: Math.max(0, i > 0 ? r.totalCases - rawData[i-1].totalCases : r.totalCases)
    }));

    const smoothData = dailyRaw.map((r, i) => {
      let sum = 0, count = 0;
      const start = Math.max(0, i - 6);
      for (let j = start; j <= i; j++) {
        sum += dailyRaw[j].newRaw;
        count++;
      }
      return { ...r, newSmooth: sum / count };
    });

    calcData = smoothData.map(r => {
      const beta = (I > 0 && S > 0) ? (r.newSmooth * N) / (I * S) : 0;
      const Rt = beta / COMMON_PARAMS.gamma;
      const Re = Rt * S / N;
      const recover = COMMON_PARAMS.gamma * I;
      S = Math.max(0, S - r.newSmooth);
      I = Math.max(0, I + r.newSmooth - recover);
      return { ...r, S, I, beta, Rt, Re, N };
    });

    // 更新日期范围
    csvMinDate = calcData[0]?.date || "";
    csvMaxDate = calcData[calcData.length - 1]?.date || "";
  } catch (e) {
    console.error("计算数据失败：", e);
    calcData = [];
  }
}

// 获取今日日期（修复时区）
function getTodayDate() {
  const today = new Date();
  return formatDate(today);
}

// 设置日期选择范围
function setDateRange() {
  try {
    const todayStr = getTodayDate();
    document.getElementById("dateRangeText").textContent = 
      `数据日期范围 Data Range：${csvMinDate} ~ ${todayStr}（原始数据至 ${csvMaxDate}，后续为预测补全 / Original data up to ${csvMaxDate}, rest are predicted）`;
    
    const dateInput = document.getElementById("dateSel");
    dateInput.min = csvMinDate;
    dateInput.max = todayStr;
    dateInput.value = csvMinDate ? todayStr : ""; 
    dateInput.disabled = !csvMinDate;
    document.querySelector("button").disabled = !csvMinDate;
  } catch (e) {
    console.error("设置日期范围失败：", e);
  }
}

// 初始化图表（核心修复：增加容错、延迟渲染）
function initChart() {
  try {
    const ctx = document.getElementById("chartRe").getContext("2d");
    if (chart) {
      chart.destroy();
    }

    // 容错：如果无数据，使用默认值
    if (!fullData || fullData.length === 0) {
      fullData = [{
        date: getTodayDate(),
        Re: 1.0
      }];
    }

    const warnLineData = fullData.map(() => COMMON_PARAMS.reWarnThreshold);
    
    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: fullData.map(x => x.date),
        datasets: [
          {
            label: `${currentState} 州 Re指数 (7日平滑) / ${currentState} State Re Index (7-day Smooth)`,
            data: fullData.map(x => (x.Re || 0).toFixed(3)),
            borderColor: "#2E86AB",
            backgroundColor: "rgba(46, 134, 171, 0.2)",
            fill: true,
            tension: 0.4,
            borderWidth: 4,
            pointBackgroundColor: "#2E86AB",
            pointBorderColor: "#fff",
            pointRadius: (context) => context.active ? 5 : 0,
            pointHoverRadius: 6,
            order: 1
          },
          {
            label: "预警阈值 Re=1.2 / Warning Threshold Re=1.2",

            max: 3, 
            title: {

// 预测72小时数据
function predict72h(S0, I0, b0, i0) {
  try {
    const N = STATE_CONFIG[currentState].population;
    let S = S0 || N * 0.9;
    let I = I0 || 1000;
    let predNew = 0;
    for (let d = 0; d < 3; d++) {
      predNew = b0 * I * S / N;
      const recover = COMMON_PARAMS.gamma * I;
      S = Math.max(0, S - predNew);
      I = Math.max(0, I + predNew - recover);
    }
    const predBeta = (I > 0 && S > 0) ? predNew * N / (I * S) : 0;
    const predRe = predBeta / COMMON_PARAMS.gamma * S / N;
    const growth = i0 === 0 ? 0 : (predNew - i0) / i0;
    return { Re: predRe, newCases: predNew, growth };
  } catch (e) {
    console.error("预测数据失败：", e);
    return { Re: 1.0, newCases: 0, growth: 0 };
  }
}

// 拆分城乡Beta值
function splitUrbanRuralBeta(totalBeta) {
  const ruralRatio = STATE_CONFIG[currentState].ruralRatio || 0.2;
  const urbanRatio = 1 - ruralRatio;
  const urbanBeta = totalBeta / (urbanRatio + COMMON_PARAMS.ruralUrbanRatio * ruralRatio);
  const ruralBeta = COMMON_PARAMS.ruralUrbanRatio * urbanBeta;
  return { urbanBeta, ruralBeta, urbanRatio, ruralRatio };
}

// 执行查询（核心修复：增加容错、默认数据）
function runQuery() {
  try {
    const inputDate = document.getElementById("dateSel").value;
    const todayStr = getTodayDate();
    const input = new Date(inputDate);
    const today = new Date(todayStr);

    if (input > today) {
      alert("不能选择未来日期 / Cannot select future date");
      return;
    }

    let targetDate = inputDate;
    // 查找目标数据（容错：无数据时用最后一条）
    let target = calcData.find(x => x.date === targetDate);
    if (!target) {
      target = calcData[calcData.length - 1];
      if (!target) {
        alert("无可用数据 / No available data");
        return;
      }
    }

    // 计算预测数据
    const statePred = predict72h(target.S, target.I, target.beta, target.newSmooth);
    const stateWarn = statePred.Re > 1.2 && statePred.growth > 0.3;
    const { urbanBeta, ruralBeta } = splitUrbanRuralBeta(target.beta);
    const urbanPred = predict72h(target.S * 0.8, target.I * 0.8, urbanBeta, target.newSmooth * 0.8);
    const ruralPred = predict72h(target.S * 0.2, target.I * 0.2, ruralBeta, target.newSmooth * 0.2);
    const urbanWarn = urbanPred.Re > 1.2 && urbanPred.growth > 0.3;
    const ruralWarn = ruralPred.Re > 1.2 && ruralPred.growth > 0.3;

    const uavTip = ruralWarn 
      ? "⚠️ 优先农村配送（高风险） / Prioritize rural delivery (High risk)" 
      : urbanWarn 
        ? "⚠️ 优先城市配送（高风险） / Prioritize urban delivery (High risk)" 
        : "✅ 无需紧急配送（安全） / No urgent delivery needed (Safe)";

    // 渲染数据（确保不会空白）
    document.getElementById("resToday").innerHTML = `
    <div class="item">
      <div><strong>查询日期 / Query Date</strong>：${inputDate}</div>
      <div><strong>当日新增 / New Cases</strong>：${Math.round(target.newRaw || 0)}</div>
      <div><strong>Re 指数 / Re Index</strong>：<span style="color:${(target.Re || 0) > 1.2 ? 'red' : 'green'}">${(target.Re || 0).toFixed(2)}</span></div>
    </div>`;

    document.getElementById("resForecast").innerHTML = `
    <div class="item">
      <div><strong>72小时预测 Re / 72h Predicted Re</strong>：${statePred.Re.toFixed(2)}</div>
      <div><strong>72小时新增 / 72h New Cases</strong>：${Math.round(statePred.newCases)}</div>
      <div><strong>增速 / Growth Rate</strong>：${(statePred.growth * 100).toFixed(1)}%</div>
      <div><strong>预警 / Warning</strong>：${stateWarn ? '⚠️ 预警 / Warning' : '✅ 安全 / Safe'}</div>
    </div>`;

    // 关键修改：保持原有结构，通过CSS统一粗体，也可手动加<strong>强化
    document.getElementById("resUrban").innerHTML = `
    <div class="item">
      <div>城市 Urban：Re=${urbanPred.Re.toFixed(2)} 增速 Growth ${(urbanPred.growth * 100).toFixed(1)}% ${urbanWarn ? '⚠️' : '✅'}</div>
      <div>农村 Rural：Re=${ruralPred.Re.toFixed(2)} 增速 Growth ${(ruralPred.growth * 100).toFixed(1)}% ${ruralWarn ? '⚠️' : '✅'}</div>
    </div>`;

    document.getElementById("resUAV").innerHTML = `
    <div class="item">
      <div><strong>无人机建议 / UAV Dispatch Suggestion</strong>：${uavTip}</div>
    </div>`;

  } catch (e) {
    console.error("查询数据失败：", e);
    alert("查询失败 / Query failed：" + e.message);
  }
}
