const COMMON_PARAMS = { 
  gamma:0.2, 
  smoothWindow:7, 
  reWarnThreshold:1.2, 
  growthWarnThreshold:0.3, 
  ruralUrbanRatio:0.77 
};

let currentCountry = "US";
let currentRegion = null;
let rawData = [], calcData = [], fullData = [], chart = null;
let csvMinDate = "", csvMaxDate = "";

function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function getTodayDate() { return formatDate(new Date()); }
function generateDateRange(start, end) {
  const dates = [];
  let current = new Date(start);
  const final = new Date(end);
  while(current <= final) {
    dates.push(formatDate(current));
    current.setDate(current.getDate()+1);
  }
  return dates;
}

function onCountryChange() {
  currentCountry = document.getElementById("countrySel").value;
  const sel = document.getElementById("stateSel");

  label.textContent = currentCountry === "US" ? "选择州 / Select State：" : "选择省 / Select Province：";
  
  regions.forEach(region => {

    opt.value = region.value;
    opt.textContent = region.name;
    sel.appendChild(opt);
  });
  
  sel.value = regions[0].value;
  loadStateData();
}

function loadStateData() {
  currentRegion = document.getElementById("stateSel").value;
  const regions = currentCountry === "US" ? US_STATES : CN_PROVINCES;
  const cfg = regions.find(r => r.value === currentRegion);
  
  if(!cfg) {
    alert("地区配置错误 / Region config error");
    return;
  }
  
  const loadingEl = document.getElementById("loading");
  loadingEl.style.display = "block";
  
  document.getElementById("resToday").innerHTML = "<div>数据加载中... / Loading data...</div>";
  document.getElementById("resForecast").innerHTML = "<div>数据加载中... / Loading data...</div>";
  document.getElementById("resUrban").innerHTML = "<div>数据加载中... / Loading data...</div>";
  document.getElementById("resUAV").innerHTML = "<div>数据加载中... / Loading data...</div>";
  document.getElementById("dateSel").disabled = true;
  document.querySelector("button").disabled = true;
  
  if(chart) {
    chart.destroy();
    chart = null;
  }
  
  Papa.parse(cfg.csv, {
    download: true,
    header: true,
    skipEmptyLines: true,
    timeout: 10000,
    complete: function(results) {
      try {
        rawData = results.data
          .filter(row => row.date && row.cases && !isNaN(+row.cases))
          .map(row => ({
            date: formatDate(row.date),
            totalCases: +row.cases
          }))
          .sort((a,b) => new Date(a.date) - new Date(b.date));
          
        if(rawData.length === 0) {
          throw new Error("CSV文件无有效数据 / No valid data in CSV");
        }
        
        calculateData(cfg);
        completeDataToToday();
        setDateRange();
        initChart(cfg);
        runQuery();
        loadingEl.style.display = "none";
      } catch(e) {
        alert("数据处理失败 / Data process failed：" + e.message);
        loadingEl.style.display = "none";
      }
    },
    error: function(err) {
      alert("文件加载失败 / File load failed：" + cfg.csv + "，请检查文件名是否正确 / Check filename");
      loadingEl.style.display = "none";
    }
  });
}

function calculateData(cfg) {
  const N = cfg.population;
  let S = N, I = 0;
  
  const dailyRaw = rawData.map((row, i) => ({
    date: row.date,
    newRaw: i > 0 ? row.totalCases - rawData[i-1].totalCases : row.totalCases
  }));
  
  const smoothData = dailyRaw.map((row, i) => {
    let sum = 0, count = 0;
    const start = Math.max(0, i - 6);
    for(let j = start; j <= i; j++) {
      sum += dailyRaw[j].newRaw;
      count++;
    }
    return {...row, newSmooth: sum / count};
  });
  
  calcData = smoothData.map(row => {
    const beta = (I > 0 && S > 0) ? (row.newSmooth * N) / (I * S) : 0;
    const Rt = beta / COMMON_PARAMS.gamma;
    const Re = Rt * S / N;
    const recover = COMMON_PARAMS.gamma * I;
    S = Math.max(0, S - row.newSmooth);
    I = Math.max(0, I + row.newSmooth - recover);
    return {...row, S, I, beta, Rt, Re, N};
  });
  
  csvMinDate = calcData[0].date;
  csvMaxDate = calcData[calcData.length-1].date;
}

function completeDataToToday() {
  const today = getTodayDate();
  const lastDate = new Date(csvMaxDate);
  
  if(new Date(today) <= lastDate) {
    fullData = [...calcData];
    return;
  }
  
  const fillDates = generateDateRange(new Date(lastDate).setDate(lastDate.getDate()+1), today);
  const last = calcData[calcData.length-1];
  
  // 【新增】判断是否是边远地区
  const isRemote = REMOTE_REGIONS.includes(currentRegion);
  
  if(isRemote) {
    // 边远地区：CSV后Re=0，无新增，感染者逐步恢复
    let currentS = last.S;
    let currentI = last.I;
    const fillData = fillDates.map(date => {
      // 没有新增，只有恢复
      const recover = COMMON_PARAMS.gamma * currentI;
      currentI = Math.max(0, currentI - recover);
      
      return {
        date: date,
        newRaw: 0,
        newSmooth: 0,
        S: currentS,
        I: currentI,
        beta: 0,
        Rt: 0,
        Re: 0,
        N: last.N
      };
    });
    fullData = [...calcData, ...fillData];
  } else {
    // 普通地区：原来的模拟波动补全
    let currentRe = last.Re;
    let currentNew = last.newSmooth;
    let currentS = last.S;
    let currentI = last.I;
    const fillData = fillDates.map(date => {
      currentRe += (Math.random() - 0.5) * 0.08;
      currentRe = Math.max(0.1, Math.min(2.5, currentRe));
      
      currentNew = currentNew * (0.98 + Math.random() * 0.04);
      currentS = Math.max(0, currentS - currentNew);
      currentI = Math.max(0, currentI + currentNew - COMMON_PARAMS.gamma * currentI);
      
      return {
        date: date,
        newRaw: currentNew,
        newSmooth: currentNew,
        S: currentS,
        I: currentI,
        beta: last.beta * (0.98 + Math.random() * 0.04),
        Rt: currentRe * last.N / currentS,
        Re: currentRe,
        N: last.N
      };
    });
    fullData = [...calcData, ...fillData];
  }
}

// 【核心修正】按照论文公式实现的72小时预测！
function predict72h(last) {
  let S = last.S, I = last.I;
  const newCasesToday = last.newSmooth;
  
  // 模拟第1天
  let newI = last.beta * S * I / last.N;
  const rec = COMMON_PARAMS.gamma * I;
  S = Math.max(0, S - newI);
  I = Math.max(0, I + newI - rec);
  
  // 模拟第2天
  newI = last.beta * S * I / last.N;
  S = Math.max(0, S - newI);
  I = Math.max(0, I + newI - rec);
  
  // 模拟第3天！这才是我们要的！
  newI = last.beta * S * I / last.N;
  S = Math.max(0, S - newI);
  I = Math.max(0, I + newI - rec);
  
  // 第3天的单日新增！不是3天总和！
  const newCases3Day = newI;
  // 增长率：(第3天的单日新增 - 今天的单日新增) / 今天的单日新增
  // 这就是论文里的公式(6)！
  const growth = newCasesToday===0 ? 0 : (newCases3Day - newCasesToday) / newCasesToday;
  // 第3天的Re
  const nextRe = (last.beta / COMMON_PARAMS.gamma) * S / last.N;
  
  return { newCases: newCases3Day, nextRe, growth };
}

function splitUrbanRuralBeta(beta, ruralRatio) {
  const urbanRatio = 1 - ruralRatio;
  const urbanBeta = beta / (urbanRatio + COMMON_PARAMS.ruralUrbanRatio * ruralRatio);
  const ruralBeta = COMMON_PARAMS.ruralUrbanRatio * urbanBeta;
  return { urbanBeta, ruralBeta };
}

function runQuery() {
  const date = document.getElementById("dateSel").value;
  const target = fullData.find(d => d.date === date) || fullData[fullData.length-1];
  const regions = currentCountry === "US" ? US_STATES : CN_PROVINCES;
  const cfg = regions.find(r => r.value === currentRegion);
  
  const statePred = predict72h(target);
  const stateWarn = statePred.nextRe > COMMON_PARAMS.reWarnThreshold && statePred.growth > COMMON_PARAMS.growthWarnThreshold;
  
  // 整体预测的预警标红
  const reColor = statePred.nextRe > COMMON_PARAMS.reWarnThreshold ? 'red' : 'inherit';
  const growthColor = statePred.growth > COMMON_PARAMS.growthWarnThreshold ? 'red' : 'inherit';
  
  const {urbanBeta, ruralBeta} = splitUrbanRuralBeta(target.beta, cfg.rural);
  const urbanPred = predict72h({S:target.S*0.8, I:target.I*0.8, beta:urbanBeta, newSmooth:target.newSmooth*0.8, N:target.N*0.8});
  const ruralPred = predict72h({S:target.S*0.2, I:target.I*0.2, beta:ruralBeta, newSmooth:target.newSmooth*0.2, N:target.N*0.2});
  const urbanWarn = urbanPred.nextRe > COMMON_PARAMS.reWarnThreshold && urbanPred.growth > COMMON_PARAMS.growthWarnThreshold;
  const ruralWarn = ruralPred.nextRe > COMMON_PARAMS.reWarnThreshold && ruralPred.growth > COMMON_PARAMS.growthWarnThreshold;
  
  // 城乡的预警标红
  const urbanReColor = urbanPred.nextRe > COMMON_PARAMS.reWarnThreshold ? 'red' : 'inherit';
  const urbanGrowthColor = urbanPred.growth > COMMON_PARAMS.growthWarnThreshold ? 'red' : 'inherit';
  const ruralReColor = ruralPred.nextRe > COMMON_PARAMS.reWarnThreshold ? 'red' : 'inherit';
  const ruralGrowthColor = ruralPred.growth > COMMON_PARAMS.growthWarnThreshold ? 'red' : 'inherit';
  
  // 当天的Re的标红！中英双语都标红！
  const todayReColor = target.Re>1.2?'red':'green';
  
  const uavTip = ruralWarn ? "⚠️ 优先农村配送 / Priority Rural Dispatch" : 
                 urbanWarn ? "⚠️ 优先城市配送 / Priority Urban Dispatch" : 
                 "✅ 无需紧急配送 / No Urgent Dispatch";
  
  document.getElementById("resToday").innerHTML = `
    <div><strong>查询日期：${date} / Date: ${date}</strong></div>
    <div>当日新增：${Math.round(target.newRaw)} / New Cases: ${Math.round(target.newRaw)}</div>
    <div>Re指数：<span style="color:${todayReColor}">${target.Re.toFixed(2)}</span> / Re Index: <span style="color:${todayReColor}">${target.Re.toFixed(2)}</span></div>
  `;
  
  document.getElementById("resForecast").innerHTML = `
    <div><strong>72h预测 Re：<span style="color:${reColor}">${statePred.nextRe.toFixed(2)}</span> / 72h Forecast Re: <span style="color:${reColor}">${statePred.nextRe.toFixed(2)}</span></strong></div>
    <div>预测新增：${Math.round(statePred.newCases)} / Forecast New Cases: ${Math.round(statePred.newCases)}</div>
    <div>增长率：<span style="color:${growthColor}">${(statePred.growth*100).toFixed(1)}%</span> / Growth: <span style="color:${growthColor}">${(statePred.growth*100).toFixed(1)}%</span></div>
    <div>预警状态：${stateWarn?'⚠️ 预警 / Warning':'✅ 安全 / Safe'}</div>
  `;
  
  document.getElementById("resUrban").innerHTML = `
    <div><strong>城市 72h预测：Re=<span style="color:${urbanReColor}">${urbanPred.nextRe.toFixed(2)}</span> 增长率=<span style="color:${urbanGrowthColor}">${(urbanPred.growth*100).toFixed(1)}%</span> ${urbanWarn?'⚠️':'✅'}</strong></div>
    <div>Urban 72h Forecast: Re=<span style="color:${urbanReColor}">${urbanPred.nextRe.toFixed(2)}</span> Growth=<span style="color:${urbanGrowthColor}">${(urbanPred.growth*100).toFixed(1)}%</span> ${urbanWarn?'⚠️':'✅'}</div>
    <div><strong>农村 72h预测：Re=<span style="color:${ruralReColor}">${ruralPred.nextRe.toFixed(2)}</span> 增长率=<span style="color:${ruralGrowthColor}">${(ruralPred.growth*100).toFixed(1)}%</span> ${ruralWarn?'⚠️':'✅'}</strong></div>
    <div>Rural 72h Forecast: Re=<span style="color:${ruralReColor}">${ruralPred.nextRe.toFixed(2)}</span> Growth=<span style="color:${ruralGrowthColor}">${(ruralPred.growth*100).toFixed(1)}%</span> ${ruralWarn?'⚠️':'✅'}</div>
  `;
  
  document.getElementById("resUAV").innerHTML = `
    <div><strong>无人机调度建议：${uavTip}</strong></div>
    <div>建议调度数量：${Math.ceil(target.I / 500)} 台 / Suggested UAVs: ${Math.ceil(target.I / 500)}</div>
  `;
}
