<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 美国各州疫情指数监测系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Microsoft YaHei}
body{background:#f5f7fa;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{background:#165DFF;color:#fff;padding:24px;text-align:center;border-radius:12px;margin-bottom:24px}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px #00000010}
.form{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select,input{padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;min-width:150px}
button{background:#165DFF;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.full{grid-column:1/-1}
.item{padding:12px;background:#f5f7fa;border-radius:8px;margin:8px 0}
.chart-box{width:100%;height:320px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 美国各州疫情指数监测系统</h1>
    <p>US States Epidemic Monitoring System | 2020‑03‑09 ~ 2020‑03‑31（测试数据）</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择州：</label>
      <select id="stateSel"></select>
      <label>选择日期：</label>
      <input type="date" id="dateSel">
      <button onclick="run()">查询数据</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>当日核心指标</h3>
      <div id="resToday"></div>
    </div>
    <div class="card">
      <h3>72小时预警</h3>
      <div id="resForecast"></div>
    </div>
    <div class="card">
      <h3>城乡监测（r=0.77）</h3>
      <div id="resUrban"></div>
    </div>
    <div class="card">
      <h3>无人机调度建议</h3>
      <div id="resUAV"></div>
    </div>
    <div class="card full">
      <h3>Re指数历史趋势</h3>
      <div class="chart-box"><canvas id="chartRe"></canvas></div>
    </div>
  </div>
</div>

<script>
// 1. 核心参数配置
const P = {
  r: 0.77,          // 农村/城市传播率比
  d0: 12, d1: 7,    // 治疗天数（无干预/干预）
  k: 5/7,           // 传染期系数
  ReTh: 1.2,        // Re预警阈值
  statePop: {       // 州人口（2020年数据）
    "Ohio": 11799448
  }
};

// 2. 累计病例转当日新增（核心函数）
function processCumulativeToDaily(cumulativeData) {
  const dailyData = [];
  for (let i = 0; i < cumulativeData.length; i++) {
    const current = cumulativeData[i];
    if (i === 0) {
      // 首日：累计=新增（无前日数据）
      dailyData.push({
        date: current.date,
        cases: current.cases,
        deaths: current.deaths
      });
    } else {
      const prev = cumulativeData[i - 1];
      // 当日新增=当日累计-前日累计（避免负数）
      const dailyCases = Math.max(0, current.cases - prev.cases);
      dailyData.push({
        date: current.date,
        cases: dailyCases,
        deaths: current.deaths
      });
    }
  }
  return dailyData;
}

// 3. Ohio测试数据（2020-03-09至2020-03-31，连续23天，语法完整）
const stateData = {
  "Ohio": processCumulativeToDaily([
    {"date":"2020-03-09","cases":39,"deaths":0},
    {"date":"2020-03-10","cases":42,"deaths":0},
    {"date":"2020-03-11","cases":47,"deaths":0},
    {"date":"2020-03-12","cases":55,"deaths":0},
    {"date":"2020-03-13","cases":67,"deaths":0},
    {"date":"2020-03-14","cases":82,"deaths":0},
    {"date":"2020-03-15","cases":97,"deaths":0},
    {"date":"2020-03-16","cases":118,"deaths":0},
    {"date":"2020-03-17","cases":142,"deaths":1},
    {"date":"2020-03-18","cases":177,"deaths":2},
    {"date":"2020-03-19","cases":220,"deaths":2},
    {"date":"2020-03-20","cases":274,"deaths":4},
    {"date":"2020-03-21","cases":347,"deaths":6},
    {"date":"2020-03-22","cases":432,"deaths":8},
    {"date":"2020-03-23","cases":529,"deaths":10},
    {"date":"2020-03-24","cases":638,"deaths":14},
    {"date":"2020-03-25","cases":761,"deaths":19},
    {"date":"2020-03-26","cases":897,"deaths":25},
    {"date":"2020-03-27","cases":1046,"deaths":32},
    {"date":"2020-03-28","cases":1208,"deaths":41},
    {"date":"2020-03-29","cases":1383,"deaths":51},
    {"date":"2020-03-30","cases":1571,"deaths":62},
    {"date":"2020-03-31","cases":1772,"deaths":75}
  ])
};

// 4. 页面初始化（加载州、日期选择器）
function initPage() {
  const stateSel = document.getElementById("stateSel");
  const states = Object.keys(stateData);
  
  // 加载州选择器
  states.forEach(state => {
    const option = document.createElement("option");
    option.value = state;
    option.textContent = state;
    stateSel.appendChild(option);
  });

  // 更新日期范围（只显示有数据的日期）
  updateDateRange("Ohio");
  
  // 监听州选择变化
  stateSel.addEventListener("change", function() {
    updateDateRange(this.value);
  });

  // 初始化图表
  initChart();
  
  // 默认查询首日数据
  run();
}

// 更新日期选择器的可选范围
function updateDateRange(state) {
  const data = stateData[state];
  const dates = data.map(item => item.date);
  const minDate = dates[0];
  const maxDate = dates[dates.length - 1];
  
  const dateSel = document.getElementById("dateSel");
  dateSel.min = minDate;
  dateSel.max = maxDate;
  dateSel.value = minDate; // 默认选中首日
}

// 5. 疫情模型核心函数
// 计算次日数据（易感、感染、新增）
function nextDay(S, I, beta, gamma, N) {
  const newCases = beta * I * S / N; // 新增病例
  const newRecover = gamma * I;      // 新增康复
  return {
    S: S - newCases,  // 次日易感人群
    I: I + newCases - newRecover, // 次日感染人群
    newCases: newCases
  };
}

// 计算Re指数（传播能力）
function calcRe(beta, gamma, S, N) {
  return (beta / gamma) * (S / N);
}

// 拆分城乡传播率
function splitBeta(betaTotal) {
  const betaA = betaTotal / (0.8 + P.r * 0.2); // 城市传播率（80%人口）
  const betaB = P.r * betaA;                    // 农村传播率（20%人口）
  return { betaA, betaB };
}

// 计算恢复率
function calcGamma(u) {
  return 1 / (P.k * (P.d0 - 5 * u));
}

// 72小时预测（3天后的Re、新增）
function predict3Days(S, I, beta, gamma, N) {
  let currentS = S;
  let currentI = I;
  let finalNewCases = 0;
  
  // 循环计算3天数据
  for (let d = 0; d < 3; d++) {
    const res = nextDay(currentS, currentI, beta, gamma, N);
    currentS = res.S;
    currentI = res.I;
    finalNewCases = res.newCases;
  }
  
  // 返回3天后的结果
  return {
    Re3: calcRe(beta, gamma, currentS, N), // 3天后Re
    nc3: finalNewCases                     // 3天后新增
  };
}

// 判断是否触发预警（双条件：Re>1.2 且 新增增长>30%）
function isWarning(Re3, currentCases, predictCases) {
  if (currentCases === 0) return false;
  const growthRate = (predictCases - currentCases) / currentCases;
  return Re3 > P.ReTh && growthRate > 0.3;
}

// 估算传播率beta
function estBeta(newCases, I, S, N) {
  if (I === 0 || S === 0) return 0;
  return (newCases * N) / (I * S);
}

// 6. 图表相关（Re指数趋势图）
let chart; // 图表实例

// 初始化图表
function initChart() {
  const ctx = document.getElementById("chartRe").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [], // 日期标签
      datasets: [{
        label: "Re指数（传播能力）",
        data: [],  // Re指数数据
        borderColor: "#165DFF",
        backgroundColor: "rgba(22, 93, 255, 0.1)",
        fill: true,
        tension: 0.3,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: 0,
          max: 3, // Re指数常见范围（0-3）
          title: {
            display: true,
            text: "Re指数（>1.2需预警）"
          }
        },
        x: {
          title: {
            display: true,
            text: "日期"
          }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: function(context) {
              return `Re指数: ${context.parsed.y.toFixed(2)}`;
            }
          }
        }
      }
    }
  });
}

// 更新图表数据（根据选中的州）
function updateChart(state) {
  const data = stateData[state];
  const N = P.statePop[state];
  
  const labels = [];
  const reData = [];
  
  // 计算每天的Re指数
  data.forEach(day => {
    const S = N - day.cases; // 易感人群（总人口-累计感染，简化计算）
    const I = day.cases;     // 感染人群（当日新增，简化计算）
    const gamma = calcGamma(0); // 恢复率（默认无干预）
    const beta = estBeta(day.cases, I, S, N); // 估算传播率
    const Re = calcRe(beta, gamma, S, N);     // 计算Re指数
    
    labels.push(day.date);
    reData.push(Re.toFixed(2));
  });
  
  // 更新图表
  chart.data.labels = labels;
  chart.data.datasets[0].data = reData;
  chart.update();
}

// 7. 主查询函数（点击“查询数据”触发）
function run() {
  const state = document.getElementById("stateSel").value;
  const targetDate = document.getElementById("dateSel").value;
  
  // 获取该州的所有数据
  const data = stateData[state];
  // 找到目标日期的数据
  const dayData = data.find(item => item.date === targetDate);
  
  // 数据校验（理论上不会触发，因为日期选择器只显示有数据的日期）
  if (!dayData) {
    alert("该日期无数据，请选择其他日期");
    return;
  }
  
  const N = P.statePop[state];          // 该州人口
  const currentCases = dayData.cases;   // 当日新增病例
  const S = N - currentCases;           // 易感人群
  const I = currentCases;               // 感染人群
  const gamma = calcGamma(0);           // 恢复率（无干预）
  const beta = estBeta(currentCases, I, S, N); // 传播率
  const Re = calcRe(beta, gamma, S, N); // 当前Re指数
  
  // 72小时预测
  const pred = predict3Days(S, I, beta, gamma, N);
  const warn = isWarning(pred.Re3, currentCases, pred.nc3);
  
  // 城乡拆分计算
  const { betaA, betaB } = splitBeta(beta);
  const popA = N * 0.8; // 城市人口（80%）
  const popB = N * 0.2; // 农村人口（20%）
  const SA = popA - currentCases * 0.8; // 城市易感
  const IA = currentCases * 0.8;        // 城市感染
  const SB = popB - currentCases * 0.2; // 农村易感
  const IB = currentCases * 0.2;        // 农村感染
  
  const ReA = calcRe(betaA, gamma, SA, popA); // 城市Re
  const ReB = calcRe(betaB, gamma, SB, popB); // 农村Re
  const warnA = isWarning(predict3Days(SA, IA, betaA, gamma, popA).Re3, IA, IA);
  const warnB = isWarning(predict3Days(SB, IB, betaB, gamma, popB).Re3, IB, IB);
  
  // 无人机调度建议
  let uavAdvice = "";
  if (warnB) {
    uavAdvice = "⚠️ 优先农村配送（农村高风险）";
  } else if (warnA) {
    uavAdvice = "⚠️ 城市配送（城市高风险）";
  } else {
    uavAdvice = "✅ 无需紧急配送（风险可控）";
  }
  
  // 渲染结果到页面
  renderResults(state, targetDate, currentCases, Re, pred, warn, ReA, ReB, warnA, warnB, uavAdvice);
  
  // 更新趋势图
  updateChart(state);
}

// 渲染查询结果到页面
function renderResults(state, date, cases, Re, pred, warn, ReA, ReB, warnA, warnB, uavAdvice) {
  // 当日指标
  document.getElementById("resToday").innerHTML = `
    <div class="item">
      <div>州/日期</div>
      <div style="font-weight:bold">${state} / ${date}</div>
    </div>
    <div class="item">
      <div>当日新增病例</div>
      <div style="font-weight:bold">${cases} 例</div>
    </div>
    <div class="item">
      <div>当前Re指数（传播能力）</div>
      <div style="font-weight:bold; color:${Re > 1.2 ? '#F53F3F' : '#00B42A'}">${Re.toFixed(2)}</div>
    </div>
  `;
  
  // 72小时预警
  document.getElementById("resForecast").innerHTML = `
    <div class="item">
      <div>72小时后Re指数预测</div>
      <div style="font-weight:bold">${pred.Re3.toFixed(2)}</div>
    </div>
    <div class="item">
      <div>72小时后新增病例预测</div>
      <div style="font-weight:bold">${Math.round(pred.nc3)} 例</div>
    </div>
    <div class="item">
      <div>预警结果</div>
      <div style="font-weight:bold; color:${warn ? '#F53F3F' : '#00B42A'}">
        ${warn ? '⚠️ 触发预警（需干预）' : '✅ 未触发预警'}
      </div>
    </div>
  `;
  
  // 城乡监测
  document.getElementById("resUrban").innerHTML = `
    <div class="item">
      <div>城市Re指数/预警</div>
      <div style="font-weight:bold">${ReA.toFixed(2)} / ${warnA ? '⚠️' : '✅'}</div>
    </div>
    <div class="item">
      <div>农村Re指数/预警</div>
      <div style="font-weight:bold">${ReB.toFixed(2)} / ${warnB ? '⚠️' : '✅'}</div>
    </div>
  `;
  
  // 无人机调度
  document.getElementById("resUAV").innerHTML = `
    <div class="item">
      <div>调度原则</div>
      <div>农村优先、风险优先</div>
    </div>
    <div class="item">
      <div>调度建议</div>
      <div style="font-weight:bold; color:${uavAdvice.includes('⚠️') ? '#F53F3F' : '#00B42A'}">
        ${uavAdvice}
      </div>
    </div>
  `;
}

// 页面加载完成后初始化
window.onload = initPage;
</script>
</body>
</html>
