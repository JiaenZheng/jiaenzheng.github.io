<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 美国Ohio州疫情指数监测系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Arial,sans-serif}
body{background:#f5f7fa;padding:24px}
.container{max-width:1200px;margin:0 auto}
header{background:#165DFF;color:#fff;padding:28px;border-radius:16px;text-align:center;margin-bottom:24px}
header h1{font-size:24px;margin-bottom:8px}
header p{opacity:0.9;font-size:14px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.form{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select,input[type="date"]{padding:10px 14px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;min-width:160px}
button{background:#165DFF;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.full{grid-column:1 / -1}
.item{padding:14px;background:#f5f7fa;border-radius:10px;margin:10px 0}
.item div{margin:4px 0}
.chart-box{width:100%;height:400px;padding-top:10px}
h3{margin-bottom:12px;color:#303133}
.loading{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 美国Ohio州疫情指数监测与无人机干预调度系统</h1>
    <p>2020-03-04 ~ 2022-01-25（694天完整数据）| 数据来源：ohio_data.csv</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择州 / Select State：</label>
      <select id="stateSel">
        <option value="Ohio" selected>Ohio</option>
      </select>
      <label>选择日期 / Select Date：</label>
      <input type="date" id="dateSel" disabled>
      <button onclick="runQuery()" disabled>查询数据 / Query Data</button>
    </div>
    <div class="loading" id="loading">加载数据中...（约2秒）</div>
  </div>

  <div class="grid" id="resultContainer" style="display:none">
    <div class="card">
      <h3>当日核心指标 / Daily Core Indicators</h3>
      <div id="resToday"></div>
    </div>
    <div class="card">
      <h3>72小时预警 / 72‑Hour Early Warning</h3>
      <div id="resForecast"></div>
    </div>
    <div class="card">
      <h3>城乡监测 / Urban‑Rural Monitoring</h3>
      <div id="resUrban"></div>
    </div>
    <div class="card">
      <h3>无人机调度建议 / UAV Dispatch Suggestion</h3>
      <div id="resUAV"></div>
    </div>
    <div class="card full">
      <h3>Re指数历史趋势 / Historical Trends of the Re Index</h3>
      <div class="chart-box"><canvas id="chartRe"></canvas></div>
    </div>
  </div>
</div>

<script>
// 模型核心参数
const MODEL_PARAMS = {
  ruralUrbanRatio: 0.77,    // 农村/城市传播率比
  noIntervDays: 12,         // 无干预治疗天数
  intervDays: 7,            // 有干预治疗天数
  infectPeriodCoeff: 5/7,   // 传染期系数
  reWarnThreshold: 1.2,     // Re预警阈值
  growthWarnThreshold: 0.3, // 新增增速预警阈值（30%）
  ohioPopulation: 11799448  // Ohio州2020年人口
};

// 全局变量：存储处理后的数据
let ohioProcessedData = [];
let chart = null;

// 1. 加载CSV数据（核心：替代硬编码，避开行数限制）
function loadCsvData() {
  // 注意：上传后需确保csv文件与index.html在同一文件夹
  Papa.parse("ohio_data.csv", {
    download: true,
    header: true,
    complete: function(results) {
      // 处理CSV数据：转换格式 + 计算当日新增
      ohioProcessedData = processCsvData(results.data);
      // 初始化页面（启用日期选择器、按钮）
      initPage();
      // 隐藏加载提示，显示结果区域
      document.getElementById("loading").style.display = "none";
      document.getElementById("resultContainer").style.display = "grid";
    },
    error: function(error) {
      alert("CSV数据加载失败，请检查文件路径：" + error.message);
    }
  });
}

// 2. 处理CSV数据：累计转当日新增 + 格式统一
function processCsvData(rawCsvData) {
  // 过滤无效数据 + 转换日期/数字格式
  const validData = rawCsvData
    .filter(row => row.date && row.cases) // 排除空行
    .map(row => ({
      date: row.date.trim(),
      cases: parseInt(row.cases),
      deaths: row.deaths ? parseInt(row.deaths) : 0
    }))
    .sort((a, b) => new Date(a.date) - new Date(b.date)); // 按日期排序

  // 计算当日新增
  const processed = [];
  for (let i = 0; i < validData.length; i++) {
    const current = validData[i];
    const prev = i > 0 ? validData[i - 1] : null;
    const dailyNew = prev ? Math.max(0, current.cases - prev.cases) : current.cases;
    
    processed.push({
      date: current.date,
      dailyCases: dailyNew,    // 当日新增
      totalCases: current.cases,    // 累计病例
      totalDeaths: current.deaths   // 累计死亡
    });
  }
  return processed;
}

// 3. 模型核心计算函数
// 计算次日易感/感染人群
function calculateNextDay(S, I, beta, gamma, N) {
  const newCases = beta * I * S / N;
  const newRecover = gamma * I;
  return {
    S: S - newCases,
    I: I + newCases - newRecover,
    newCases: newCases
  };
}

// 计算Re指数
function calculateRe(beta, gamma, S, N) {
  return (beta / gamma) * (S / N);
}

// 拆分城乡传播率
function splitUrbanRuralBeta(totalBeta) {
  const urbanBeta = totalBeta / (0.8 + MODEL_PARAMS.ruralUrbanRatio * 0.2);
  const ruralBeta = MODEL_PARAMS.ruralUrbanRatio * urbanBeta;
  return { urbanBeta, ruralBeta };
}

// 计算恢复率
function calculateGamma(interventionLevel = 0) {
  const treatmentDays = MODEL_PARAMS.noIntervDays - 5 * interventionLevel;
  return 1 / (MODEL_PARAMS.infectPeriodCoeff * treatmentDays);
}

// 72小时预测
function predict72Hours(S, I, beta, gamma, N, currentDaily) {
  let currentS = S;
  let currentI = I;
  let predictedNew = 0;

  for (let d = 0; d < 3; d++) {
    const result = calculateNextDay(currentS, currentI, beta, gamma, N);
    currentS = result.S;
    currentI = result.I;
    predictedNew = result.newCases;
  }

  const growthRate = currentDaily === 0 ? 0 : (predictedNew - currentDaily) / currentDaily;
  return {
    predictedRe: calculateRe(beta, gamma, currentS, N),
    predictedNewCases: predictedNew,
    growthRate: growthRate
  };
}

// 估算传播率beta
function estimateBeta(dailyCases, infected, susceptible, population) {
  if (infected === 0 || susceptible === 0) return 0;
  return (dailyCases * population) / (infected * susceptible);
}

// 4. 图表初始化与更新
function initChart() {
  const ctx = document.getElementById("chartRe").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Re指数（传播能力）",
        data: [],
        borderColor: "#165DFF",
        backgroundColor: "rgba(22, 93, 255, 0.1)",
        fill: true,
        tension: 0.3,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: 0,
          max: 10, // 适配高Re值（如8.98）
          title: { display: true, text: "Re指数（>1.2需预警）" }
        },
        x: {
          title: { display: true, text: "日期" },
          ticks: { maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 30 }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: (context) => `Re指数: ${context.parsed.y.toFixed(2)}`
          }
        }
      }
    }
  });
}

function updateChart() {
  const labels = ohioProcessedData.map(item => item.date);
  const reData = ohioProcessedData.map(item => {
    const N = MODEL_PARAMS.ohioPopulation;
    const I = item.totalCases;
    const S = N - I;
    const gamma = calculateGamma();
    const beta = estimateBeta(item.dailyCases, I, S, N);
    return calculateRe(beta, gamma, S, N).toFixed(2);
  });

  chart.data.labels = labels;
  chart.data.datasets[0].data = reData;
  chart.update();
}

// 5. 页面初始化
function initPage() {
  // 初始化日期选择器范围
  const minDate = ohioProcessedData[0].date;
  const maxDate = ohioProcessedData[ohioProcessedData.length - 1].date;
  const dateInput = document.getElementById("dateSel");
  dateInput.min = minDate;
  dateInput.max = maxDate;
  dateInput.value = minDate;
  dateInput.disabled = false;

  // 启用查询按钮
  document.querySelector("button").disabled = false;

  // 初始化图表
  initChart();
  updateChart();

  // 默认查询首日数据
  runQuery();
}

// 6. 主查询函数
function runQuery() {
  const targetDate = document.getElementById("dateSel").value;
  const targetData = ohioProcessedData.find(item => item.date === targetDate);

  if (!targetData) {
    alert("所选日期无数据，请选择其他日期");
    return;
  }

  // 基础参数计算
  const N = MODEL_PARAMS.ohioPopulation;
  const dailyCases = targetData.dailyCases;
  const totalInfected = targetData.totalCases;
  const susceptible = N - totalInfected;
  const gamma = calculateGamma();
  const beta = estimateBeta(dailyCases, totalInfected, susceptible, N);
  const currentRe = calculateRe(beta, gamma, susceptible, N);

  // 全州72小时预测
  const stateForecast = predict72Hours(susceptible, totalInfected, beta, gamma, N, dailyCases);
  const isStateWarn = stateForecast.predictedRe > MODEL_PARAMS.reWarnThreshold && stateForecast.growthRate > MODEL_PARAMS.growthWarnThreshold;

  // 城乡拆分计算
  const { urbanBeta, ruralBeta } = splitUrbanRuralBeta(beta);
  const urbanPop = N * 0.8; // 城市人口（80%）
  const ruralPop = N * 0.2; // 农村人口（20%）
  const urbanInfected = totalInfected * 0.8;
  const ruralInfected = totalInfected * 0.2;
  const urbanSusceptible = urbanPop - urbanInfected;
  const ruralSusceptible = ruralPop - ruralInfected;
  const urbanDaily = dailyCases * 0.8;
  const ruralDaily = dailyCases * 0.2;

  // 城市72小时预测
  const urbanForecast = predict72Hours(urbanSusceptible, urbanInfected, urbanBeta, gamma, urbanPop, urbanDaily);
  const isUrbanWarn = urbanForecast.predictedRe > MODEL_PARAMS.reWarnThreshold && urbanForecast.growthRate > MODEL_PARAMS.growthWarnThreshold;

  // 农村72小时预测
  const ruralForecast = predict72Hours(ruralSusceptible, ruralInfected, ruralBeta, gamma, ruralPop, ruralDaily);
  const isRuralWarn = ruralForecast.predictedRe > MODEL_PARAMS.reWarnThreshold && ruralForecast.growthRate > MODEL_PARAMS.growthWarnThreshold;

  // 无人机调度建议
  let uavSuggestion = "";
  if (isRuralWarn) {
    uavSuggestion = "⚠️ 优先农村配送（农村高风险）/ Prioritize Rural Delivery (High Risk)";
  } else if (isUrbanWarn) {
    uavSuggestion = "⚠️ 优先城市配送（城市高风险）/ Prioritize Urban Delivery (High Risk)";
  } else {
    uavSuggestion = "✅ 无需紧急配送（风险可控）/ No Urgent Delivery (Controllable Risk)";
  }

  // 渲染结果
  renderResults(targetDate, dailyCases, currentRe, stateForecast, isStateWarn, urbanForecast, ruralForecast, isUrbanWarn, isRuralWarn, uavSuggestion);
}

// 7. 结果渲染函数
function renderResults(date, daily, re, stateForecast, isStateWarn, urbanForecast, ruralForecast, isUrbanWarn, isRuralWarn, uav) {
  // 当日指标
  document.getElementById("resToday").innerHTML = `
    <div class="item"><div>日期 / Date</div><div style="font-weight:bold">${date}</div></div>
    <div class="item"><div>当日新增病例 / Daily New Cases</div><div style="font-weight:bold">${Math.round(daily)}</div></div>
    <div class="item"><div>当前Re指数 / Current Re Index</div><div style="font-weight:bold;color:${re>1.2?"#F53F3F":"#00B42A"}">${re.toFixed(2)}</div></div>
  `;

  // 72小时预警
  document.getElementById("resForecast").innerHTML = `
    <div class="item"><div>72h Re预测 / 72h Re Prediction</div><div style="font-weight:bold">${stateForecast.predictedRe.toFixed(2)}</div></div>
    <div class="item"><div>72h新增预测 / 72h New Cases Prediction</div><div style="font-weight:bold">${Math.round(stateForecast.predictedNewCases)}</div></div>
    <div class="item"><div>72h增速 / 72h Growth Rate</div><div style="font-weight:bold">${(stateForecast.growthRate*100).toFixed(1)}%</div></div>
    <div class="item"><div>预警状态 / Warning Status</div><div style="font-weight:bold;color:${isStateWarn?"#F53F3F":"#00B42A"}">${isStateWarn?"⚠️ 触发预警":"✅ 未触发预警"}</div></div>
  `;

  // 城乡监测
  document.getElementById("resUrban").innerHTML = `
    <div class="item"><div>城市 / Urban</div><div>Re: ${urbanForecast.predictedRe.toFixed(2)} | 增速: ${(urbanForecast.growthRate*100).toFixed(1)}% | ${isUrbanWarn?"⚠️":"✅"}</div></div>
    <div class="item"><div>农村 / Rural</div><div>Re: ${ruralForecast.predictedRe.toFixed(2)} | 增速: ${(ruralForecast.growthRate*100).toFixed(1)}% | ${isRuralWarn?"⚠️":"✅"}</div></div>
  `;

  // 无人机调度
  document.getElementById("resUAV").innerHTML = `
    <div class="item"><div>调度建议 / Dispatch Suggestion</div><div style="font-weight:bold;color:${uav.includes("⚠️")?"#F53F3F":"#00B42A"}">${uav}</div></div>
  `;
}

// 页面加载完成后，自动加载CSV数据
window.onload = loadCsvData;
</script>
</body>
</html>
