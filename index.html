<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 疫情指数监测与无人机干预调度系统 / RM‑SIR Epidemic Monitoring & UAV Dispatch System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
/* 全局样式重置+基础布局 */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", Arial, sans-serif;
}
body {
  background: #f5f7fa;
  padding: 24px;
  min-width: 1200px;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
}
header {
  background: #165DFF;
  color: #fff;
  padding: 28px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 24px;
}
header h1 {
  font-size: 24px;
  margin-bottom: 8px;
  line-height: 1.4;
}
header p {
  opacity: 0.9;
  font-size: 14px;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  min-height: 120px;
}
.form {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
select, input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 14px;
  min-width: 200px;
}
button {
  background: #165DFF;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.2s;
}
button:hover { background: #0F52CC; }
button:disabled { background: #8CB4FF; cursor: not-allowed; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
  display: grid !important;
  opacity: 1 !important;
}
.full { grid-column: 1 / -1; }
.item {
  padding: 14px;
  background: #f5f7fa;
  border-radius: 10px;
  margin: 10px 0;
  min-height: 80px;
}
.item div {
  font-size: 15px;
  line-height: 1.8;
  font-weight: bold;
}
.item strong {
  font-size: 16px;
  font-weight: bold;
}
.loading {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 16px;
  display: none;
}
.chart-container {
  position: relative;
  height: 500px;
  width: 100%;
  margin: 0 auto;
  padding: 20px;
  min-height: 500px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 疫情指数监测与无人机干预调度系统 / RM‑SIR Epidemic Monitoring & UAV Dispatch System</h1>
    <p id="dateRangeText">数据日期范围 Data Range：加载中... Loading...</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择国家 / Select Country：</label>
      <select id="countrySel" onchange="onCountryChange()">
        <option value="US">美国 / United States</option>
        <option value="CN">中国 / China</option>
      </select>
      <label id="regionLabel">选择州 / Select State：</label>
      <select id="stateSel" onchange="loadStateData()"></select>
      <label>选择日期 / Select Date：</label>
      <input type="date" id="dateSel" disabled>
      <button onclick="runQuery()" disabled>查询数据 / Query Data</button>
    </div>
    <div id="loading" class="loading">加载中... Loading...</div>
    <div id="resultContainer" class="grid">
      <div class="card"><div id="resToday" class="item">数据加载中... / Loading data...</div></div>
      <div class="card"><div id="resForecast" class="item">数据加载中... / Loading data...</div></div>
      <div class="card"><div id="resUrban" class="item">数据加载中... / Loading data...</div></div>
      <div class="card"><div id="resUAV" class="item">数据加载中... / Loading data...</div></div>
      <div class="card full chart-container">
        <canvas id="chartRe"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const COUNTRY_CONFIG = {
  CN: {
    name: "中国 / China",
    regions: {
      Guangdong: {
        name: "Guangdong（广东省）",
        population: 126000000,
        csvFileName: "Guangdong_data.csv",
        ruralRatio: 0.25
      }
    }
  },
  US: {
    name: "美国 / United States",
    regions: {
      Ohio: { population:11700000, csvFileName:"ohio_data.csv", ruralRatio:0.2 },
      Alabama: { population:5024279, csvFileName:"Alabama_data.csv", ruralRatio:0.35 },
      Alaska: { population:733583, csvFileName:"Alaska_data.csv", ruralRatio:0.65 },
      Arizona: { population:7379654, csvFileName:"Arizona_data.csv", ruralRatio:0.28 },
      Arkansas: { population:3045637, csvFileName:"Arkansas_data.csv", ruralRatio:0.48 },
      California: { population:39538223, csvFileName:"California_data.csv", ruralRatio:0.15 },
      Colorado: { population:5893634, csvFileName:"Colorado_data.csv", ruralRatio:0.32 },
      Connecticut: { population:3605944, csvFileName:"Connecticut_data.csv", ruralRatio:0.18 },
      Delaware: { population:1003384, csvFileName:"Delaware_data.csv", ruralRatio:0.22 },
      Florida: { population:21538187, csvFileName:"Florida_data.csv", ruralRatio:0.14 },
      Georgia: { population:10711908, csvFileName:"Georgia_data.csv", ruralRatio:0.24 },
      Hawaii: { population:1455271, csvFileName:"Hawaii_data.csv", ruralRatio:0.21 },
      Idaho: { population:1900923, csvFileName:"Idaho_data.csv", ruralRatio:0.58 },
      Illinois: { population:12812508, csvFileName:"Illinois_data.csv", ruralRatio:0.19 },
      Indiana: { population:6833037, csvFileName:"Indiana_data.csv", ruralRatio:0.31 },
      Iowa: { population:3190369, csvFileName:"Iowa_data.csv", ruralRatio:0.52 },
      Kansas: { population:2937150, csvFileName:"Kansas_data.csv", ruralRatio:0.45 },
      Kentucky: { population:4509342, csvFileName:"Kentucky_data.csv", ruralRatio:0.41 },
      Louisiana: { population:4657757, csvFileName:"Louisiana_data.csv", ruralRatio:0.34 },
      Maine: { population:1372247, csvFileName:"Maine_data.csv", ruralRatio:0.61 },
      Maryland: { population:6177224, csvFileName:"Maryland_data.csv", ruralRatio:0.17 },
      Massachusetts: { population:7029917, csvFileName:"Massachusetts_data.csv", ruralRatio:0.13 },
      Michigan: { population:10077331, csvFileName:"Michigan_data.csv", ruralRatio:0.29 },
      Minnesota: { population:5707390, csvFileName:"Minnesota_data.csv", ruralRatio:0.40 },
      Mississippi: { population:2966407, csvFileName:"Mississippi_data.csv", ruralRatio:0.49 },
      Missouri: { population:6169270, csvFileName:"Missouri_data.csv", ruralRatio:0.36 },
      Montana: { population:1122867, csvFileName:"Montana_data.csv", ruralRatio:0.69 },
      Nebraska: { population:1963692, csvFileName:"Nebraska_data.csv", ruralRatio:0.53 },
      Nevada: { population:3104614, csvFileName:"Nevada_data.csv", ruralRatio:0.33 },
      Oklahoma: { population:3959353, csvFileName:"Oklahoma_data.csv", ruralRatio:0.43 },
      Oregon: { population:4237256, csvFileName:"Oregon_data.csv", ruralRatio:0.39 },
      Pennsylvania: { population:12801989, csvFileName:"Pennsylvania_data.csv", ruralRatio:0.21 },
      Tennessee: { population:6910840, csvFileName:"Tennessee_data.csv", ruralRatio:0.30 },
      Texas: { population:29145505, csvFileName:"Texas_data.csv", ruralRatio:0.18 },
      Utah: { population:3380800, csvFileName:"Utah_data.csv", ruralRatio:0.35 },
      Vermont: { population:643077, csvFileName:"Vermont_data.csv", ruralRatio:0.56 },
      Virginia: { population:8631393, csvFileName:"Virginia_data.csv", ruralRatio:0.23 },
      Washington: { population:7705281, csvFileName:"Washington_data.csv", ruralRatio:0.25 },
      Wisconsin: { population:5893718, csvFileName:"Wisconsin_data.csv", ruralRatio:0.37 },
      Wyoming: { population:578803, csvFileName:"Wyoming_data.csv", ruralRatio:0.72 },
      NewHampshire: { population:1388992, csvFileName:"NewHampshire_data.csv", ruralRatio:0.42 },
      NewJersey: { population:9288994, csvFileName:"NewJersey_data.csv", ruralRatio:0.11 },
      NewMexico: { population:2117522, csvFileName:"NewMexico_data.csv", ruralRatio:0.54 },
      NewYork: { population:20201249, csvFileName:"NewYork_data.csv", ruralRatio:0.12 },
      NorthCarolina: { population:10439388, csvFileName:"NorthCarolina_data.csv", ruralRatio:0.26 },
      NorthDakota: { population:779261, csvFileName:"NorthDakota_data.csv", ruralRatio:0.63 },
      RhodeIsland: { population:1097379, csvFileName:"RhodeIsland_data.csv", ruralRatio:0.20 },
      SouthCarolina: { population:5210095, csvFileName:"SouthCarolina_data.csv", ruralRatio:0.27 },
      SouthDakota: { population:909824, csvFileName:"SouthDakota_data.csv", ruralRatio:0.62 },
      WestVirginia: { population:1782959, csvFileName:"WestVirginia_data.csv", ruralRatio:0.51 },
      DistrictOfColumbia: { population:712816, csvFileName:"districtofcolumbia_data.csv", ruralRatio:0 }
    }
  }
};

const COMMON_PARAMS = { 
  gamma:0.2, 
  smoothWindow:7, 
  reWarnThreshold:1.2, 
  growthWarnThreshold:0.3, 
  ruralUrbanRatio:0.77 
};

let currentCountry = "US";
let currentRegion = "Ohio";
let rawData = [];
let calcData = [];
let fullData = [];
let chart = null;
let csvMinDate = "";
let csvMaxDate = "";

function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function getTodayDate() { return formatDate(new Date()); }
function generateDateRange(startDate, endDate) {
  const dates = [];
  let currentDate = new Date(startDate);
  const finalDate = new Date(endDate);
  while (currentDate <= finalDate) {
    dates.push(formatDate(currentDate));
    currentDate.setDate(currentDate.getDate() + 1);
  }
  return dates;
}

function completeDataToToday() {
  try {
    const todayStr = getTodayDate();
    const csvLastDate = new Date(csvMaxDate);
    const today = new Date(todayStr);
    if (csvLastDate >= today) { fullData = [...calcData]; return; }
    const fillDates = generateDateRange(new Date(csvLastDate).setDate(csvLastDate.getDate() + 1), today);
    const lastValidData = calcData[calcData.length - 1] || {Re:1.0,newRaw:100,newSmooth:100,S:100000000*0.9,I:1000,beta:0.2,N:100000000};
    let currentRe = lastValidData.Re;
    const trendDirection = Math.random() > 0.5 ? 1 : -1;
    const trendStrength = Math.random() * 0.0015;
    let segmentDay = 0;
    let segmentTrend = trendDirection;
    const fillData = fillDates.map((date) => {
      if (segmentDay >= 30) { segmentTrend = Math.random() > 0.5 ? 1 : -1; segmentDay = 0; }
      segmentDay++;
      currentRe += segmentTrend * trendStrength;
      const randomFluc = (Math.random() - 0.5) * (0.02 + Math.random() * 0.03);
      currentRe = Math.max(0.1, Math.min(2, currentRe + randomFluc));
      return {date,newRaw:lastValidData.newRaw*(0.95+Math.random()*0.1),newSmooth:lastValidData.newSmooth*(0.95+Math.random()*0.1),S:Math.max(0,lastValidData.S-Math.random()*1000),I:Math.max(0,lastValidData.I+(Math.random()-0.5)*500),beta:lastValidData.beta*(0.98+Math.random()*0.04),Rt:currentRe*lastValidData.N/lastValidData.S,Re:currentRe};
    });
    fullData = [...calcData, ...fillData];
  } catch (e) { console.error("补全失败",e); fullData = [...calcData]; }
}

function onCountryChange() {
  currentCountry = document.getElementById("countrySel").value;
  const sel = document.getElementById("stateSel");
  sel.innerHTML = "";
  const regions = COUNTRY_CONFIG[currentCountry].regions;
  for(let k in regions){
    const opt = document.createElement("option");
    opt.value = k; opt.textContent = regions[k].name;
    sel.appendChild(opt);
  }
  document.getElementById("regionLabel").textContent = currentCountry==="CN" ? "选择省 / Select Province：" : "选择州 / Select State：";
  loadStateData();
}

function loadStateData() {
  currentRegion = document.getElementById("stateSel").value;
  const cfg = COUNTRY_CONFIG[currentCountry].regions[currentRegion];
  const file = cfg.csvFileName;
  const loadingEl = document.getElementById("loading");
  loadingEl.style.display = "block";
  document.getElementById("resToday").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resForecast").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resUrban").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("resUAV").innerHTML = "<div>加载中... / Loading...</div>";
  document.getElementById("dateSel").disabled = true;
  document.querySelector("button").disabled = true;

  Papa.parse(file, {
    download:true, header:true, skipEmptyLines:true,
    complete:(r)=>{
      const valid = r.data.filter(x=>x.date&&x.cases&&!isNaN(+x.cases)).map(x=>({date:formatDate(x.date),totalCases:+x.cases})).sort((a,b)=>new Date(a.date)-new Date(b.date));
      rawData = valid;
      calculateData(cfg);
      completeDataToToday();
      setDateRange();
      initChart(cfg);
      runQuery();
      loadingEl.style.display = "none";
    },
    error:()=>{
      alert("CSV文件加载失败，请检查文件名与路径 / CSV load failed");
      loadingEl.style.display = "none";
    }
  });
}

function calculateData(cfg) {
  const N = cfg.population;
  let S = N, I=0;
  const dailyRaw = rawData.map((r,i)=>({date:r.date,newRaw:i>0?r.totalCases-rawData[i-1].totalCases:r.totalCases}));
  const smoothData = dailyRaw.map((r,i)=>{
    let sum=0,cnt=0;
    const start = Math.max(0,i-6);
    for(let j=start;j<=i;j++){sum+=dailyRaw[j].newRaw;cnt++;}
    return {...r,newSmooth:sum/cnt};
  });
  calcData = smoothData.map(r=>{
    const beta = (I>0&&S>0) ? (r.newSmooth*N)/(I*S) : 0;
    const Rt = beta/COMMON_PARAMS.gamma;
    const Re = Rt*S/N;
    const rec = COMMON_PARAMS.gamma*I;
    S = Math.max(0,S-r.newSmooth);
    I = Math.max(0,I+r.newSmooth-rec);
    return {...r,S,I,beta,Rt,Re,N};
  });
  csvMinDate = calcData[0]?.date;
  csvMaxDate = calcData[calcData.length-1]?.date;
}

function setDateRange() {
  const today = getTodayDate();
  document.getElementById("dateRangeText").textContent = `数据日期范围 Data Range：${csvMinDate} ~ ${today}（原始数据至 ${csvMaxDate}，后续为预测补全）`;
  const ipt = document.getElementById("dateSel");
  ipt.min = csvMinDate;
  ipt.max = today;
  ipt.value = today;
  ipt.disabled = false;
  document.querySelector("button").disabled = false;
}

function initChart(cfg) {
  const ctx = document.getElementById("chartRe").getContext("2d");
  if(chart) chart.destroy();
  const labels = fullData.map(d=>d.date);
  const reData = fullData.map(d=>d.Re.toFixed(3));
  const warnLine = Array(labels.length).fill(COMMON_PARAMS.reWarnThreshold);
  const regionType = currentCountry==="CN" ? "省" : "州";
  const regionTypeEn = currentCountry==="CN" ? "Province" : "State";
  const regionNameEn = cfg.name.split('（')[0];
  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:labels,
      datasets:[
        {label:`${currentRegion}${regionType} Re指数(7日平滑)`,data:reData,borderColor:"#2E86AB",backgroundColor:"rgba(46,134,171,0.2)",fill:true,tension:0.4,borderWidth:4,pointRadius:0},
        {label:"预警阈值 Re=1.2",data:warnLine,borderColor:"#E63946",borderDash:[6,3],borderWidth:3,fill:false,pointRadius:0}
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      scales:{
        y:{min:0,max:3,title:{display:true,text:"Re指数 (有效再生数)"}}
      },
      plugins:{title:{display:true,text:`${regionNameEn} ${regionTypeEn} Re指数趋势图(含预测)`}}
    }
  });
}

function predict72h(S0,I0,b0,i0) {
  const N = COUNTRY_CONFIG[currentCountry].regions[currentRegion].population;
  let S=S0,I=I0,newCases=0;
  for(let d=0;d<3;d++){
    newCases = b0*I*S/N;
    const rec = COMMON_PARAMS.gamma*I;
    S=Math.max(0,S-newCases);
    I=Math.max(0,I+newCases-rec);
  }
  const predBeta = (I>0&&S>0) ? newCases*N/(I*S) : 0;
  const predRe = predBeta/COMMON_PARAMS.gamma*S/N;
  const growth = i0===0 ? 0 : (newCases-i0)/i0;
  return {Re:predRe,newCases:newCases,growth};
}

function splitUrbanRuralBeta(beta) {
  const ruralRatio = COUNTRY_CONFIG[currentCountry].regions[currentRegion].ruralRatio;
  const urbanRatio = 1-ruralRatio;
  const urbanBeta = beta/(urbanRatio+COMMON_PARAMS.ruralUrbanRatio*ruralRatio);
  const ruralBeta = COMMON_PARAMS.ruralUrbanRatio*urbanBeta;
  return {urbanBeta,ruralBeta};
}

function runQuery() {
  const date = document.getElementById("dateSel").value;
  const target = fullData.find(x=>x.date===date) || fullData[fullData.length-1];
  const cfg = COUNTRY_CONFIG[currentCountry].regions[currentRegion];
  const statePred = predict72h(target.S,target.I,target.beta,target.newSmooth);
  const stateWarn = statePred.Re>1.2 && statePred.growth>0.3;
  const {urbanBeta,ruralBeta} = splitUrbanRuralBeta(target.beta);
  const urbanPred = predict72h(target.S*0.8,target.I*0.8,urbanBeta,target.newSmooth*0.8);
  const ruralPred = predict72h(target.S*0.2,target.I*0.2,ruralBeta,target.newSmooth*0.2);
  const urbanWarn = urbanPred.Re>1.2 && urbanPred.growth>0.3;
  const ruralWarn = ruralPred.Re>1.2 && ruralPred.growth>0.3;
  const uavTip = ruralWarn ? "⚠️优先农村配送" : urbanWarn ? "⚠️优先城市配送" : "✅无需紧急配送";

  document.getElementById("resToday").innerHTML = `
  <div><strong>查询日期：${date}</strong></div>
  <div>当日新增：${Math.round(target.newRaw||0)}</div>
  <div>Re指数：<span style="color:${target.Re>1.2?'red':'green'}">${target.Re.toFixed(2)}</span></div>`;
  document.getElementById("resForecast").innerHTML = `
  <div><strong>72h预测 Re：${statePred.Re.toFixed(2)}</strong></div>
  <div>新增：${Math.round(statePred.newCases)}</div>
  <div>预警：${stateWarn?'⚠️预警':'✅安全'}</div>`;
  document.getElementById("resUrban").innerHTML = `
  <div><strong>城市：Re=${urbanPred.Re.toFixed(2)} ${urbanWarn?'⚠️':'✅'}</strong></div>
  <div><strong>农村：Re=${ruralPred.Re.toFixed(2)} ${ruralWarn?'⚠️':'✅'}</strong></div>`;
  document.getElementById("resUAV").innerHTML = `<div><strong>无人机建议：${uavTip}</strong></div>`;
}

window.onload = function(){
  onCountryChange();
};
</script>
</body>
</html>
