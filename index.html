<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 美国Ohio州疫情指数监测系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Arial,sans-serif}
body{background:#f5f7fa;padding:24px}
.container{max-width:1200px;margin:0 auto}
header{background:#165DFF;color:#fff;padding:28px;border-radius:16px;text-align:center;margin-bottom:24px}
header h1{font-size:24px;margin-bottom:8px}
header p{opacity:0.9;font-size:14px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.form{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select,input[type="date"]{padding:10px 14px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;min-width:160px}
button{background:#165DFF;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.full{grid-column:1 / -1}
.item{padding:14px;background:#f5f7fa;border-radius:10px;margin:10px 0}
.item div{margin:4px 0}
.chart-box{width:100%;height:400px;padding-top:10px}
h3{margin-bottom:12px;color:#303133}
.loading{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 美国Ohio州疫情指数监测系统</h1>
    <p>严格按论文公式：D=5, γ=0.2；3天平滑；I=累计</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择州 / Select State：</label>
      <select id="stateSel">
        <option value="Ohio" selected>Ohio</option>
      </select>
      <label>选择日期 / Select Date：</label>
      <input type="date" id="dateSel">
      <button onclick="run()">查询数据 / Query Data</button>
    </div>
    <div class="loading" id="loading">加载数据中...</div>
  </div>

  <div class="grid" id="resultContainer" style="display:none">
    <div class="card"><div id="resToday"></div></div>
    <div class="card"><div id="resForecast"></div></div>
    <div class="card"><div id="resUrban"></div></div>
    <div class="card"><div id="resUAV"></div></div>
    <div class="card full">
      <div class="chart-box"><canvas id="chartRe"></canvas></div>
    </div>
  </div>
</div>

<script>
// 论文参数：D=5 → γ=0.2；3天平滑；I=累计
const P = {
  D: 5,
  gamma: 1/5,
  smoothWin: 3,
  reWarn: 1.2,
  growthTh: 0.3,
  ohioPop: 11690000
};

let rawData = [];
let smoothData = [];
let chart = null;

// 1. 加载CSV
function loadCsvData() {
  Papa.parse("ohio_data.csv", {
    download: true,
    header: true,
    complete: res => {
      rawData = res.data
        .filter(x => x.date && x.cases)
        .map(x => ({
          date: x.date.trim(),
          total: parseInt(x.cases),
          deaths: parseInt(x.deaths||0)
        }))
        .sort((a,b)=>new Date(a.date)-new Date(b.date));
      processSmooth();
      initPage();
      document.getElementById("loading").style.display="none";
      document.getElementById("resultContainer").style.display="grid";
    }
  });
}

// 2. 原始新增 + 3天平滑（论文）
function processSmooth() {
  let daily = [];
  for(let i=0;i<rawData.length;i++){
    let prev = i>0 ? rawData[i-1].total : 0;
    daily.push({
      date: rawData[i].date,
      total: rawData[i].total,
      newRaw: Math.max(0, rawData[i].total - prev)
    });
  }
  // 3天平滑
  smoothData = daily.map((d,i)=>{
    let sum=0,cnt=0;
    for(let j=Math.max(0,i-P.smoothWin+1);j<=i;j++){
      sum += daily[j].newRaw; cnt++;
    }
    return {
      date: d.date,
      total: d.total,
      newRaw: d.newRaw,
      newSmooth: sum/cnt
    };
  });
}

// 3. 论文公式：Re = (β/γ)*(S/N)
function calcBeta(newSmooth, I, S, N) {
  if(I===0||S===0) return 0;
  return newSmooth / (I * S / N);
}
function calcRe(beta, S, N) {
  return (beta / P.gamma) * (S / N);
}

// 4. 72h预测（仅用于预警，不改Re）
function nextDay(S,I,beta,N) {
  let newInf = beta * I * S / N;
  let newRem = P.gamma * I;
  return {S:S-newInf, I:I+newInf-newRem, newInf};
}
function predict72(S,I,beta,N,cur) {
  let s=S,i=I,new3=0;
  for(let d=0;d<3;d++){
    let t=nextDay(s,i,beta,N);
    s=t.S; i=t.I; new3=t.newInf;
  }
  let g=cur===0?0:(new3-cur)/cur;
  return {Re:calcRe(beta,s,N), new3, g};
}
function isW(re,g) { return re>P.reWarn && g>P.growthTh; }

// 5. 图表（Y=0~3，Re在1附近）
function initChart() {
  let ctx=document.getElementById("chartRe").getContext("2d");
  chart=new Chart(ctx,{
    type:"line",
    data:{labels:[],datasets:[{
      label:"Re指数（论文公式）",
      data:[],
      borderColor:"#165DFF",
      backgroundColor:"rgba(22,93,255,0.1)",
      fill:true, tension:0.3, borderWidth:3
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{
        y:{min:0,max:3,title:{display:true,text:"Re指数"}},
        x:{ticks:{maxRotation:45,autoSkip:true,maxTicksLimit:30}}
      }
    }
  });
}
function updateChart() {
  let labs=[], res=[];
  smoothData.forEach(d=>{
    let N=P.ohioPop;
    let I=d.total;          // I=累计（论文）
    let S=N-I;
    let beta=calcBeta(d.newS, I, S, N);
    let re=calcRe(beta, S, N);
    labs.push(d.date);
    res.push(re.toFixed(2));
  });
  chart.data.labels=labs;
  chart.data.datasets[0].data=res;
  chart.update();
}

// 6. 页面
function initPage() {
  let d0=smoothData[0].date;
  let d1=smoothData.at(-1).date;
  let el=document.getElementById("dateSel");
  el.min=d0; el.max=d1; el.value=d0; el.disabled=false;
  document.querySelector("button").disabled=false;
  initChart();
  updateChart();
  run();
}

// 7. 主查询
function run() {
  let dt=document.getElementById("dateSel").value;
  let d=smoothData.find(x=>x.date===dt);
  if(!d) return;

  let N=P.ohioPop;
  let I=d.total;
  let S=N-I;
  let beta=calcBeta(d.newS, I, S, N);
  let re=calcRe(beta, S, N);

  // 全州预警
  let pred=predict72(S,I,beta,N,d.newS);
  let warn=isW(pred.Re, pred.g);

  // 城乡：80%/20%
  let r=0.77;
  let bA=beta/(0.8+r*0.2);
  let bB=r*bA;
  let popA=N*0.8, popB=N*0.2;
  let IA=I*0.8, IB=I*0.2;
  let SA=popA-IA, SB=popB-IB;
  let newA=d.newS*0.8, newB=d.newS*0.2;

  let reA=calcRe(bA, SA, popA);
  let reB=calcRe(bB, SB, popB);
  let predA=predict72(SA,IA,bA,popA,newA);
  let predB=predict72(SB,IB,bB,popB,newB);
  let wA=isW(predA.Re, predA.g);
  let wB=isW(predB.Re, predB.g);

  let u=wB?"⚠️优先农村":wA?"⚠️优先城市":"✅无需调度";

  // 渲染
  document.getElementById("resToday").innerHTML=`
  <div class="item">日期:${dt}</div>
  <div class="item">当日新增(原始):${Math.round(d.newRaw)}</div>
  <div class="item">平滑新增:${Math.round(d.newS)}</div>
  <div class="item">Re:${re.toFixed(2)}</div>`;

  document.getElementById("resForecast").innerHTML=`
  <div class="item">72h Re:${pred.Re.toFixed(2)}</div>
  <div class="item">增速:${(pred.g*100).toFixed(1)}%</div>
  <div class="item" style="color:${warn?"red":"green"}">${warn?"触发预警":"正常"}</div>`;

  document.getElementById("resUrban").innerHTML=`
  <div class="item">城市 Re:${reA.toFixed(2)} | ${wA?"⚠️":"✅"}</div>
  <div class="item">农村 Re:${reB.toFixed(2)} | ${wB?"⚠️":"✅"}</div>`;

  document.getElementById("resUAV").innerHTML=`<div class="item">${u}</div>`;
}

window.onload=loadCsvData;
</script>

</body>
</html>
