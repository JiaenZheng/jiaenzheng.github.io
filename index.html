<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 美国50州疫情指数监测系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",Arial,sans-serif}
body{background:#f5f7fa;padding:24px}
.container{max-width:1200px;margin:0 auto}
header{background:#165DFF;color:#fff;padding:28px;border-radius:16px;text-align:center;margin-bottom:24px}
header h1{font-size:24px;margin-bottom:8px}
header p{opacity:0.9;font-size:14px}
.card{background:#fff;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.form{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
select,input[type="date"]{padding:10px 14px;border:1px solid #dcdfe6;border-radius:8px;font-size:14px;min-width:200px}
button{background:#165DFF;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.full{grid-column:1 / -1}
.item{padding:14px;background:#f5f7fa;border-radius:10px;margin:10px 0}
.item div{margin:4px 0}
.loading{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 美国50州疫情指数监测与无人机干预调度系统 / RM‑SIR US 50 States Epidemic Monitoring & UAV Dispatch System</h1>
    <p id="dateRangeText">数据日期范围 Data Range：加载中... Loading...</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择州 / Select State：</label>
      <select id="stateSel" onchange="loadStateData()">
        <option value="Alabama">Alabama（阿拉巴马州）</option>
        <option value="Alaska">Alaska（阿拉斯加州）</option>
        <option value="Arizona">Arizona（亚利桑那州）</option>
        <option value="Arkansas">Arkansas（阿肯色州）</option>
        <option value="California">California（加利福尼亚州）</option>
        <option value="Colorado">Colorado（科罗拉多州）</option>
        <option value="Connecticut">Connecticut（康涅狄格州）</option>
        <option value="Delaware">Delaware（特拉华州）</option>
        <option value="DistrictOfColumbia">District of Columbia（哥伦比亚特区）</option>
        <option value="Florida">Florida（佛罗里达州）</option>
        <option value="Georgia">Georgia（佐治亚州）</option>
        <option value="Hawaii">Hawaii（夏威夷州）</option>
        <option value="Idaho">Idaho（爱达荷州）</option>
        <option value="Illinois">Illinois（伊利诺伊州）</option>
        <option value="Indiana">Indiana（印第安纳州）</option>
        <option value="Iowa">Iowa（艾奥瓦州）</option>
        <option value="Kansas">Kansas（堪萨斯州）</option>
        <option value="Kentucky">Kentucky（肯塔基州）</option>
        <option value="Louisiana">Louisiana（路易斯安那州）</option>
        <option value="Maine">Maine（缅因州）</option>
        <option value="Maryland">Maryland（马里兰州）</option>
        <option value="Massachusetts">Massachusetts（马萨诸塞州）</option>
        <option value="Michigan">Michigan（密歇根州）</option>
        <option value="Minnesota">Minnesota（明尼苏达州）</option>
        <option value="Mississippi">Mississippi（密西西比州）</option>
        <option value="Missouri">Missouri（密苏里州）</option>
        <option value="Montana">Montana（蒙大拿州）</option>
        <option value="Nebraska">Nebraska（内布拉斯加州）</option>
        <option value="Nevada">Nevada（内华达州）</option>
        <option value="NewHampshire">New Hampshire（新罕布什尔州）</option>
        <option value="NewJersey">New Jersey（新泽西州）</option>
        <option value="NewMexico">New Mexico（新墨西哥州）</option>
        <option value="NewYork">New York（纽约州）</option>
        <option value="NorthCarolina">North Carolina（北卡罗来纳州）</option>
        <option value="NorthDakota">North Dakota（北达科他州）</option>
        <option value="Ohio" selected>Ohio（俄亥俄州）</option>
        <option value="Oklahoma">Oklahoma（俄克拉荷马州）</option>
        <option value="Oregon">Oregon（俄勒冈州）</option>
        <option value="Pennsylvania">Pennsylvania（宾夕法尼亚州）</option>
        <option value="RhodeIsland">Rhode Island（罗得岛州）</option>
        <option value="SouthCarolina">South Carolina（南卡罗来纳州）</option>
        <option value="SouthDakota">South Dakota（南达科他州）</option>
        <option value="Tennessee">Tennessee（田纳西州）</option>
        <option value="Texas">Texas（得克萨斯州）</option>
        <option value="Utah">Utah（犹他州）</option>
        <option value="Vermont">Vermont（佛蒙特州）</option>
        <option value="Virginia">Virginia（弗吉尼亚州）</option>
        <option value="Washington">Washington（华盛顿州）</option>
        <option value="WestVirginia">West Virginia（西弗吉尼亚州）</option>
        <option value="Wisconsin">Wisconsin（威斯康星州）</option>
        <option value="Wyoming">Wyoming（怀俄明州）</option>
      </select>
      <label>选择日期 / Select Date：</label>
      <input type="date" id="dateSel" disabled>
      <button onclick="runQuery()" disabled>查询数据 / Query Data</button>
    </div>
    <div class="loading" id="loading">加载中... Loading...</div>
  </div>

  <div class="grid" id="resultContainer" style="display:none">
    <div class="card"><div id="resToday"></div></div>
    <div class="card"><div id="resForecast"></div></div>
    <div class="card"><div id="resUrban"></div></div>
    <div class="card"><div id="resUAV"></div></div>
    <div class="card full"><canvas id="chartRe" style="width:100%;height:400px"></canvas></div>
  </div>
</div>

<script>
const STATE_CONFIG = {
  Ohio: { population:11700000, csvBaseName:"ohio_data", ruralRatio:0.2 },
  Alabama: { population:5024279, csvBaseName:"alabama_data", ruralRatio:0.35 },
  Alaska: { population:733583, csvBaseName:"alaska_data", ruralRatio:0.65 },
  Arizona: { population:7379654, csvBaseName:"arizona_data", ruralRatio:0.28 },
  Arkansas: { population:3045637, csvBaseName:"arkansas_data", ruralRatio:0.48 },
  California: { population:39538223, csvBaseName:"california_data", ruralRatio:0.15 },
  Colorado: { population:5893634, csvBaseName:"colorado_data", ruralRatio:0.32 },
  Connecticut: { population:3605944, csvBaseName:"connecticut_data", ruralRatio:0.18 },
  Delaware: { population:1003384, csvBaseName:"delaware_data", ruralRatio:0.22 },
  // 修正：哥伦比亚特区匹配全小写的districtofcolumbia_data.csv
  DistrictOfColumbia: { population:712816, csvBaseName:"districtofcolumbia_data", ruralRatio:0 },
  Florida: { population:21538187, csvBaseName:"florida_data", ruralRatio:0.14 },
  Georgia: { population:10711908, csvBaseName:"georgia_data", ruralRatio:0.24 },
  Hawaii: { population:1455271, csvBaseName:"hawaii_data", ruralRatio:0.21 },
  Idaho: { population:1900923, csvBaseName:"idaho_data", ruralRatio:0.58 },
  Illinois: { population:12812508, csvBaseName:"illinois_data", ruralRatio:0.19 },
  Indiana: { population:6833037, csvBaseName:"indiana_data", ruralRatio:0.31 },
  Iowa: { population:3190369, csvBaseName:"iowa_data", ruralRatio:0.52 },
  Kansas: { population:2937150, csvBaseName:"kansas_data", ruralRatio:0.45 },
  Kentucky: { population:4509342, csvBaseName:"kentucky_data", ruralRatio:0.41 },
  Louisiana: { population:4657757, csvBaseName:"louisiana_data", ruralRatio:0.34 },
  Maine: { population:1372247, csvBaseName:"maine_data", ruralRatio:0.61 },
  Maryland: { population:6177224, csvBaseName:"maryland_data", ruralRatio:0.17 },
  Massachusetts: { population:7029917, csvBaseName:"massachusetts_data", ruralRatio:0.13 },
  Michigan: { population:10077331, csvBaseName:"michigan_data", ruralRatio:0.29 },
  Minnesota: { population:5707390, csvBaseName:"minnesota_data", ruralRatio:0.40 },
  Mississippi: { population:2966407, csvBaseName:"mississippi_data", ruralRatio:0.49 },
  Missouri: { population:6169270, csvBaseName:"missouri_data", ruralRatio:0.36 },
  Montana: { population:1122867, csvBaseName:"montana_data", ruralRatio:0.69 },
  Nebraska: { population:1963692, csvBaseName:"nebraska_data", ruralRatio:0.53 },
  Nevada: { population:3104614, csvBaseName:"nevada_data", ruralRatio:0.33 },
  NewHampshire: { population:1388992, csvBaseName:"NewHampshire_data", ruralRatio:0.42 },
  NewJersey: { population:9288994, csvBaseName:"NewJersey_data", ruralRatio:0.11 },
  NewMexico: { population:2117522, csvBaseName:"NewMexico_data", ruralRatio:0.54 },
  NewYork: { population:20201249, csvBaseName:"NewYork_data", ruralRatio:0.12 },
  NorthCarolina: { population:10439388, csvBaseName:"NorthCarolina_data", ruralRatio:0.26 },
  NorthDakota: { population:779261, csvBaseName:"NorthDakota_data", ruralRatio:0.63 },
  Oklahoma: { population:3959353, csvBaseName:"oklahoma_data", ruralRatio:0.43 },
  Oregon: { population:4237256, csvBaseName:"oregon_data", ruralRatio:0.39 },
  Pennsylvania: { population:12801989, csvBaseName:"pennsylvania_data", ruralRatio:0.21 },
  RhodeIsland: { population:1097379, csvBaseName:"RhodeIsland_data", ruralRatio:0.20 },
  SouthCarolina: { population:5210095, csvBaseName:"SouthCarolina_data", ruralRatio:0.27 },
  SouthDakota: { population:909824, csvBaseName:"SouthDakota_data", ruralRatio:0.62 },
  Tennessee: { population:6910840, csvBaseName:"tennessee_data", ruralRatio:0.30 },
  Texas: { population:29145505, csvBaseName:"texas_data", ruralRatio:0.18 },
  Utah: { population:3380800, csvBaseName:"utah_data", ruralRatio:0.35 },
  Vermont: { population:643077, csvBaseName:"vermont_data", ruralRatio:0.56 },
  Virginia: { population:8631393, csvBaseName:"virginia_data", ruralRatio:0.23 },
  Washington: { population:7705281, csvBaseName:"washington_data", ruralRatio:0.25 },
  WestVirginia: { population:1782959, csvBaseName:"WestVirginia_data", ruralRatio:0.51 },
  Wisconsin: { population:5893718, csvBaseName:"wisconsin_data", ruralRatio:0.37 },
  Wyoming: { population:578803, csvBaseName:"wyoming_data", ruralRatio:0.72 }
};

const COMMON_PARAMS = { gamma:0.2, smoothWindow:7, reWarnThreshold:1.2, growthWarnThreshold:0.3, ruralUrbanRatio:0.77 };

let currentState = "Ohio", rawData = [], calcData = [], chart = null;

function formatDate(d) {
  const date = new Date(d.replace(/\//g, '-'));
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 严格使用配置里的文件名，不再自动转换大小写
function getPaths(bn) {
  return [`${bn}.csv`];
}

function tryLoad(paths, idx=0) {
  if(idx >= paths.length) {
    alert(`${currentState} 无有效数据 / No valid data，自动切回Ohio州`);
    document.getElementById("stateSel").value = "Ohio";
    loadStateData();
    return;
  }
  Papa.parse(paths[idx], { 
    download:true, 
    header:true, 
    skipEmptyLines:true,
    complete:r=>{
      const validData = r.data.filter(x=>x.date&&x.cases&&!isNaN(+x.cases))
        .map(x=>({date:formatDate(x.date), totalCases:+x.cases}))
        .sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(validData.length===0) return tryLoad(paths, idx+1);
      rawData = validData;
      calculateData();
      setDateRange();
      initChart();
      runQuery();
      document.getElementById("loading").style.display="none";
      document.getElementById("resultContainer").style.display="grid";
    },
    error:()=>tryLoad(paths, idx+1)
  });
}

function loadStateData() {
  currentState = document.getElementById("stateSel").value;
  document.getElementById("loading").style.display="block";
  document.getElementById("resultContainer").style.display="none";
  document.getElementById("dateSel").value="";
  document.getElementById("dateSel").disabled=true;
  document.querySelector("button").disabled=true;
  document.getElementById("dateRangeText").textContent = "数据日期范围 Data Range：加载中... Loading...";
  tryLoad(getPaths(STATE_CONFIG[currentState].csvBaseName));
}

function calculateData() {
  const N = STATE_CONFIG[currentState].population;
  let S=N, I=0;
  const dailyRaw = rawData.map((r,i)=>({
    date:r.date,
    newRaw: Math.max(0, i>0 ? r.totalCases-rawData[i-1].totalCases : r.totalCases)
  }));
  const smoothData = dailyRaw.map((r,i)=>{
    let sum=0, count=0;
    const start=Math.max(0,i-6);
    for(let j=start;j<=i;j++){sum+=dailyRaw[j].newRaw;count++;}
    return {...r, newSmooth:sum/count};
  });
  calcData = smoothData.map(r=>{
    const beta = (I>0&&S>0) ? (r.newSmooth*N)/(I*S) : 0;
    const Rt = beta/COMMON_PARAMS.gamma;
    const Re = Rt * S/N;
    const res = {...r, S, I, beta, Rt, Re};
    const recover = COMMON_PARAMS.gamma*I;
    S = Math.max(0, S - r.newSmooth);
    I = Math.max(0, I + r.newSmooth - recover);
    return res;
  });
}

function setDateRange() {
  const minDate = calcData[0].date;
  const maxDate = calcData[calcData.length-1].date;
  document.getElementById("dateRangeText").textContent = `数据日期范围 Data Range：${minDate} ~ ${maxDate}`;
  const dateInput = document.getElementById("dateSel");
  dateInput.min = minDate;
  dateInput.max = maxDate;
  dateInput.value = minDate;
  dateInput.disabled = false;
  document.querySelector("button").disabled = false;
}

function initChart() {
  const ctx = document.getElementById("chartRe").getContext("2d");
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels:calcData.map(x=>x.date),
      datasets:[{
        label:`${currentState} 州 Re指数 / ${currentState} State Re Index`,
        data:calcData.map(x=>x.Re.toFixed(2)),
        borderColor:"#165DFF",
        backgroundColor:"rgba(22,93,255,0.1)",
        fill:true,
        tension:0.3,
        borderWidth:2
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      scales:{
        y:{min:0,max:3, title:{display:true, text:"Re指数 / Re Index"}},
        x:{ticks:{maxRotation:45, autoSkip:true, maxTicksLimit:30}, title:{display:true, text:"日期 / Date"}}
      }
    }
  });
}

function predict72h(S0,I0,b0,i0) {
  const N=STATE_CONFIG[currentState].population;
  let S=S0, I=I0, predNew=0;
  for(let d=0;d<3;d++){
    predNew = b0*I*S/N;
    const recover = COMMON_PARAMS.gamma*I;
    S = Math.max(0, S - predNew);
    I = Math.max(0, I + predNew - recover);
  }
  const predBeta = (I>0&&S>0) ? predNew*N/(I*S) :0;
  const predRe = predBeta/COMMON_PARAMS.gamma * S/N;
  const growth = i0===0?0:(predNew-i0)/i0;
  return {Re:predRe, newCases:predNew, growth};
}

function splitUrbanRuralBeta(totalBeta) {
  const ruralRatio = STATE_CONFIG[currentState].ruralRatio;
  const urbanRatio = 1 - ruralRatio;
  const urbanBeta = totalBeta / (urbanRatio + COMMON_PARAMS.ruralUrbanRatio*ruralRatio);
  const ruralBeta = COMMON_PARAMS.ruralUrbanRatio * urbanBeta;
  return {urbanBeta, ruralBeta, urbanRatio, ruralRatio};
}

function runQuery() {
  const targetDate = document.getElementById("dateSel").value;
  const target = calcData.find(x=>x.date===targetDate);
  if(!target) return alert("所选日期无数据 / No data for selected date，请重新选择");

  const statePred = predict72h(target.S, target.I, target.beta, target.newSmooth);
  const stateWarn = statePred.Re>1.2 && statePred.growth>0.3;
  const {urbanBeta, ruralBeta, urbanRatio, ruralRatio} = splitUrbanRuralBeta(target.beta);
  const urbanPred = predict72h(target.S*urbanRatio, target.I*urbanRatio, urbanBeta, target.newSmooth*urbanRatio);
  const ruralPred = predict72h(target.S*ruralRatio, target.I*ruralRatio, ruralBeta, target.newSmooth*ruralRatio);
  const urbanWarn = urbanPred.Re>1.2 && urbanPred.growth>0.3;
  const ruralWarn = ruralPred.Re>1.2 && ruralPred.growth>0.3;

  const uavTip = ruralWarn?"⚠️ 优先农村配送（高风险）/ Prioritize Rural Delivery":urbanWarn?"⚠️ 优先城市配送（高风险）/ Prioritize Urban Delivery":"✅ 无需紧急配送（风险可控）/ No Urgent Delivery";

  document.getElementById("resToday").innerHTML=
  `<div class="item">
    <div><strong>日期 Date</strong>：${target.date}</div>
    <div><strong>当日新增（原始）Raw New</strong>：${Math.round(target.newRaw)}</div>
    <div><strong>当前Re指数 Current Re</strong>：<span style="color:${target.Re>1.2?'#F53F3F':'#00B42A'}">${target.Re.toFixed(2)}</span></div>
  </div>`;

  document.getElementById("resForecast").innerHTML=
  `<div class="item">
    <div><strong>72小时预测Re指数 72h Predicted Re</strong>：${statePred.Re.toFixed(2)}</div>
    <div><strong>72小时新增预测 72h New Cases</strong>：${Math.round(statePred.newCases)}</div>
    <div><strong>72小时增速 72h Growth</strong>：${(statePred.growth*100).toFixed(1)}%</div>
    <div><strong>预警状态 Warning</strong>：<span style="color:${stateWarn?'#F53F3F':'#00B42A'}">${stateWarn?"⚠️ 触发预警 Warning":"✅ 未触发预警 Safe"}</span></div>
  </div>`;

  document.getElementById("resUrban").innerHTML=
  `<div class="item">
    <div><strong>城市 Urban</strong>：Re=${urbanPred.Re.toFixed(2)} | 增速 Growth=${(urbanPred.growth*100).toFixed(1)}% ${urbanWarn?"⚠️":"✅"}</div>
    <div><strong>农村 Rural</strong>：Re=${ruralPred.Re.toFixed(2)} | 增速 Growth=${(ruralPred.growth*100).toFixed(1)}% ${ruralWarn?"⚠️":"✅"}</div>
  </div>`;

  document.getElementById("resUAV").innerHTML=
  `<div class="item">
    <div><strong>无人机调度建议 UAV Suggestion</strong>：<span style="color:${uavTip.includes('⚠️')?'#F53F3F':'#00B42A'}">${uavTip}</span></div>
  </div>`;
}

window.onload=()=>loadStateData();
</script>
</body>
</html>
