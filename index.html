<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM-SIR 疫情指数监测与预警系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #165DFF;
  --success: #00B42A;
  --danger: #F53F3F;
  --bg: #F7F8FA;
  --card: #FFFFFF;
  --text: #1D2129;
  --text-light: #4E5969;
  --border: #E5E6EB;
}
* {margin:0;padding:0;box-sizing:border-box;}
body {
  font-family:"Noto Sans SC",sans-serif;
  background-color:var(--bg);
  color:var(--text);
  line-height:1.6;
}
.container {
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}
header {
  background:linear-gradient(135deg,var(--primary),#0F4CD0);
  color:white;
  padding:24px 0;
  border-radius:12px;
  margin-bottom:24px;
  text-align:center;
  box-shadow:0 4px 12px rgba(22,93,255,0.15);
}
header h1 {font-size:24px;font-weight:700;}
header p {font-size:14px;opacity:0.9;margin-top:4px;}
.card-grid {
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}
@media (min-width:768px) {
  .card-grid {grid-template-columns:1fr 1fr;}
}
.card {
  background:var(--card);
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  border:1px solid var(--border);
}
.card-title {
  font-size:16px;
  font-weight:500;
  color:var(--text-light);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card-title i {color:var(--primary);}
.form-group {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.form-group label {font-weight:500;}
input[type="date"] {
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:6px;
  font-size:14px;
  outline:none;
  transition:border 0.2s;
}
input[type="date"]:focus {border-color:var(--primary);}
.btn {
  background:var(--primary);
  color:white;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:background 0.2s;
}
.btn:hover {background:#0F4CD0;}
.result-item {
  padding:12px;
  background:var(--bg);
  border-radius:8px;
  margin-bottom:8px;
}
.result-label {font-size:14px;color:var(--text-light);}
.result-value {font-size:18px;font-weight:500;margin-top:4px;}
.warn {color:var(--danger);font-weight:500;}
.safe {color:var(--success);font-weight:500;}
.chart-container {
  width:100%;
  height:320px;
  margin-top:16px;
}
.full-width {grid-column:1 / -1;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM-SIR 疫情指数监测与预警系统</h1>
    <p>基于城乡差异化模型｜72小时前瞻预警｜无人机物流调度辅助</p>
  </header>

  <div class="card">
    <div class="card-title">
      <span>📅 日期查询</span>
    </div>
    <div class="form-group">
      <label>选择日期：</label>
      <input type="date" id="dateSel" value="2020-03-15">
      <button class="btn" onclick="run()">查询数据</button>
    </div>
  </div>

  <div class="card-grid">
    <!-- 当日指标 -->
    <div class="card">
      <div class="card-title">
        <span>📊 当日核心指标</span>
      </div>
      <div id="resToday"></div>
    </div>

    <!-- 72小时预警 -->
    <div class="card">
      <div class="card-title">
        <span>🚨 72小时风险预警</span>
      </div>
      <div id="resForecast"></div>
    </div>

    <!-- 城乡拆分 -->
    <div class="card">
      <div class="card-title">
        <span>🏙️ 城乡差异化监测（r=0.77）</span>
      </div>
      <div id="resUrbanRural"></div>
    </div>

    <!-- 调度建议 -->
    <div class="card">
      <div class="card-title">
        <span>🤖 无人机调度建议</span>
      </div>
      <div id="resUAV"></div>
    </div>

    <!-- 历史曲线（通栏） -->
    <div class="card full-width">
      <div class="card-title">
        <span>📈 Re指数历史趋势 + 预警标记</span>
      </div>
      <div class="chart-container">
        <canvas id="chartRe"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 1. 论文参数（固定） ==========
const P = {
  N: 11690000,
  fA: 0.8, fB: 0.2,
  NA: 9352000, NB: 2338000,
  r: 0.77,
  d0: 12, d1: 7,
  k: 5/7,
  ReTh: 1.2,
  IncTh: 1.3
};

// ========== 2. Ohio 真实数据（论文附录2） ==========
const rawData = [
  {date:"2020-03-09",cases:39,deaths:0},
  {date:"2020-03-10",cases:42,deaths:0},
  {date:"2020-03-11",cases:47,deaths:0},
  {date:"2020-03-12",cases:55,deaths:0},
  {date:"2020-03-13",cases:67,deaths:0},
  {date:"2020-03-14",cases:86,deaths:0},
  {date:"2020-03-15",cases:114,deaths:0},
  {date:"2020-03-16",cases:151,deaths:0},
  {date:"2020-03-17",cases:201,deaths:0},
  {date:"2020-03-18",cases:270,deaths:0},
  {date:"2020-03-19",cases:358,deaths:0},
  {date:"2020-03-20",cases:472,deaths:1},
  {date:"2020-03-21",cases:629,deaths:3},
  {date:"2020-03-22",cases:831,deaths:3},
  {date:"2020-03-23",cases:1056,deaths:6},
  {date:"2020-03-24",cases:1325,deaths:8},
  {date:"2020-03-25",cases:1633,deaths:11},
  {date:"2020-03-26",cases:2020,deaths:15},
  {date:"2020-03-27",cases:2455,deaths:22},
  {date:"2020-03-28",cases:2890,deaths:25},
  {date:"2020-03-29",cases:3347,deaths:30},
  {date:"2020-03-30",cases:3824,deaths:40},
  {date:"2020-03-31",cases:4358,deaths:55},
  {date:"2020-04-01",cases:4948,deaths:65},
  {date:"2020-04-02",cases:5583,deaths:81},
  {date:"2020-04-03",cases:6272,deaths:91}
];

// ========== 3. 核心模型函数（论文公式） ==========
function nextDay(S, I, beta, gamma, N) {
  let newCases = beta * I * S / N;
  let newRecover = gamma * I;
  return { S: S - newCases, I: I + newCases - newRecover, newCases };
}

function calcRe(beta, gamma, S, N) {
  return beta / gamma * S / N;
}

function splitBeta(betaTotal) {
  let betaA = betaTotal / (P.fA + P.r * P.fB);
  let betaB = P.r * betaA;
  return { betaA, betaB };
}

function calcGamma(u) {
  let d = P.d0 - 5 * u;
  return 1 / (P.k * d);
}

function predict3Days(S, I, beta, gamma, N) {
  let s = S, i = I, nc = 0;
  for (let d = 0; d < 3; d++) {
    let res = nextDay(s, i, beta, gamma, N);
    s = res.S; i = res.I; nc = res.newCases;
  }
  return { S3: s, I3: i, nc3: nc, Re3: calcRe(beta, gamma, s, N) };
}

function isWarning(Re3, ncNow, nc3) {
  if (ncNow === 0) return false;
  let incRate = (nc3 - ncNow) / ncNow;
  return Re3 > P.ReTh && incRate > 0.3;
}

function estBeta(nc, I, S, N) {
  if (I === 0 || S === 0) return 0;
  return nc * N / (I * S);
}

// ========== 4. 全局变量 & 图表 ==========
let chart;
let history = [];

function initChart() {
  const ctx = document.getElementById("chartRe").getContext("2d");
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [
        { 
          label: "Re指数", 
          data: [], 
          borderColor: "#165DFF",
          backgroundColor: "rgba(22,93,255,0.1)",
          fill: true,
          tension: 0.2,
          borderWidth: 2
        },
        { 
          label: "预警触发", 
          data: [], 
          borderColor: "#F53F3F",
          pointBackgroundColor: "#F53F3F",
          pointRadius: 5,
          showLine: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          suggestedMin: 0,
          suggestedMax: 3,
          grid: { color: "rgba(0,0,0,0.05)" }
        },
        x: { grid: { display: false } }
      },
      plugins: { legend: { position: "top" } }
    }
  });
}

// ========== 5. 主计算函数 ==========
function run() {
  let date = document.getElementById("dateSel").value;
  let idx = rawData.findIndex(x => x.date === date);
  if (idx === -1) { alert("无该日期数据"); return; }

  // 当日数据
  let today = rawData[idx];
  let ncNow = today.cases;
  let S = P.N - ncNow;
  let I = ncNow;
  let gamma = calcGamma(0);
  let beta = estBeta(ncNow, I, S, P.N);
  let Re = calcRe(beta, gamma, S, P.N);

  // 72小时预测
  let pred = predict3Days(S, I, beta, gamma, P.N);
  let warn = isWarning(pred.Re3, ncNow, pred.nc3);

  // 城乡拆分
  let { betaA, betaB } = splitBeta(beta);
  let S_A = P.NA - ncNow * P.fA;
  let I_A = ncNow * P.fA;
  let S_B = P.NB - ncNow * P.fB;
  let I_B = ncNow * P.fB;
  let ReA = calcRe(betaA, gamma, S_A, P.NA);
  let ReB = calcRe(betaB, gamma, S_B, P.NB);
  let predA = predict3Days(S_A, I_A, betaA, gamma, P.NA);
  let predB = predict3Days(S_B, I_B, betaB, gamma, P.NB);
  let warnA = isWarning(predA.Re3, I_A, predA.I3);
  let warnB = isWarning(predB.Re3, I_B, predB.I3);

  // 无人机建议
  let uAdv = "";
  if (warnB) uAdv = '<span class="warn">⚠️ 优先农村地区配送（高风险）</span>';
  else if (warnA) uAdv = '<span class="warn">⚠️ 城市地区配送（高风险）</span>';
  else uAdv = '<span class="safe">✅ 无需调度无人机（风险可控）</span>';

  // 渲染当日指标
  document.getElementById("resToday").innerHTML = `
    <div class="result-item">
      <div class="result-label">统计日期</div>
      <div class="result-value">${today.date}</div>
    </div>
    <div class="result-item">
      <div class="result-label">当日新增病例</div>
      <div class="result-value">${ncNow} 例</div>
    </div>
    <div class="result-item">
      <div class="result-label">当前Re指数（疫情传播强度）</div>
      <div class="result-value">${Re.toFixed(2)}</div>
    </div>
  `;

  // 渲染预警
  document.getElementById("resForecast").innerHTML = `
    <div class="result-item">
      <div class="result-label">72小时后Re指数预测</div>
      <div class="result-value">${pred.Re3.toFixed(2)}</div>
    </div>
    <div class="result-item">
      <div class="result-label">72小时后新增病例预测</div>
      <div class="result-value">${Math.round(pred.nc3)} 例</div>
    </div>
    <div class="result-item">
      <div class="result-label">双条件预警结果</div>
      <div class="result-value">${warn ? '<span class="warn">⚠️ 触发预警（需干预）</span>' : '<span class="safe">✅ 未触发预警（安全）</span>'}</div>
    </div>
  `;

  // 渲染城乡
  document.getElementById("resUrbanRural").innerHTML = `
    <div class="result-item">
      <div class="result-label">城市核心区Re指数 / 预警</div>
      <div class="result-value">${ReA.toFixed(2)} / ${warnA ? '<span class="warn">⚠️</span>' : '<span class="safe">✅</span>'}</div>
    </div>
    <div class="result-item">
      <div class="result-label">偏远农村区Re指数 / 预警</div>
      <div class="result-value">${ReB.toFixed(2)} / ${warnB ? '<span class="warn">⚠️</span>' : '<span class="safe">✅</span>'}</div>
    </div>
  `;

  // 渲染调度建议
  document.getElementById("resUAV").innerHTML = `
    <div class="result-item">
      <div class="result-label">调度优先级原则</div>
      <div class="result-value">农村优先、风险优先、精准投送</div>
    </div>
    <div class="result-item">
      <div class="result-label">最终调度指令</div>
      <div class="result-value">${uAdv}</div>
    </div>
  `;

  // 更新图表
  history.push({ date: today.date, Re, warn: warn ? 1 : 0 });
  chart.data.labels.push(today.date);
  chart.data.datasets[0].data.push(Re);
  chart.data.datasets[1].data.push(warn ? 1 : null);
  chart.update();
}

// 页面加载初始化
window.onload = function() {
  initChart();
  run();
};
</script>
</body>
</html>
