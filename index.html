<style>
* {

}
body {

}
.container {

  margin: 0 auto;
}
header {
  background: #165DFF;

  padding: 28px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 24px;
}
header h1 {
  font-size: 24px;
  margin-bottom: 8px;
  line-height: 1.4;
}
header p {
  opacity: 0.9;
  font-size: 14px;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  min-height: 120px;
}
.form {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
select, input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 14px;
  min-width: 220px;
  height: 42px;
  appearance: none;
  background: #fff url('data:image/svg+xml;utf8,<svg fill="%23666" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') no-repeat right 10px center;
  background-size: 16px;
  padding-right: 35px;
}
button {
  background: #165DFF;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;

  font-size: 14px;
  height: 42px;
  transition: background 0.2s;
}
button:hover { background: #0F52CC; }
button:disabled { background: #8CB4FF; cursor: not-allowed; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.full { grid-column: 1 / -1; }
.item {
  padding: 14px;
  background: #f5f7fa;
  border-radius: 10px;
  margin: 10px 0;
  min-height: 80px;
}
.item div {

}
.item strong {

  font-weight: bold;
}
.loading {

  padding: 20px;
  color: #666;
  font-size: 16px;
  display: none;
}
.chart-container {
  position: relative;
  height: 500px;
  width: 100%;
  margin: 0 auto;
  padding: 20px;
  min-height: 500px;
}
</style>
</head>
<body>

  <header>
    <h1>RM‑SIR 疫情指数监测与无人机干预调度系统</h1>
    <p id="dateRangeText">数据日期范围：加载中...</p>

  <div class="card">
    <div class="form">

      <div class="card"><div id="resForecast" class="item">数据加载中...</div></div>
      <div class="card"><div id="resUrban" class="item">数据加载中...</div></div>

  {value:"NewYork", name:"纽约州", population:20201249, csv:"NewYork_data.csv", rural:0.12},
  {value:"NorthCarolina", name:"北卡罗来纳州", population:10439388, csv:"NorthCarolina_data.csv", rural:0.26},
  {value:"NorthDakota", name:"北达科他州", population:779261, csv:"NorthDakota_data.csv", rural:0.63},
  {value:"RhodeIsland", name:"罗得岛州", population:1097379, csv:"RhodeIsland_data.csv", rural:0.20},
  {value:"SouthCarolina", name:"南卡罗来纳州", population:5210095, csv:"SouthCarolina_data.csv", rural:0.27},
  {value:"SouthDakota", name:"南达科他州", population:909824, csv:"SouthDakota_data.csv", rural:0.62},
  {value:"WestVirginia", name:"西弗吉尼亚州", population:1782959, csv:"WestVirginia_data.csv", rural:0.51},
  {value:"DistrictOfColumbia", name:"哥伦比亚特区", population:712816, csv:"districtofcolumbia_data.csv", rural:0}
];

const CN_PROVINCES = [
  {value:"Guangdong", name:"广东省", population:126000000, csv:"Guangdong_data.csv", rural:0.25}
];

const COMMON_PARAMS = { gamma:0.2, reWarnThreshold:1.2 };
let currentCountry = "US";
let currentRegion = null;
let rawData = [], calcData = [], fullData = [], chart = null;
let csvMinDate = "", csvMaxDate = "";

// 工具函数
function formatDate(d) {
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getTodayDate() { return formatDate(new Date()); }
function generateDateRange(start, end) {
  const dates = [];
  let current = new Date(start);
  const final = new Date(end);
  while(current <= final) {
    dates.push(formatDate(current));
    current.setDate(current.getDate()+1);
  }
  return dates;
}

// 国家切换
function onCountryChange() {
  currentCountry = document.getElementById("countrySel").value;
  const sel = document.getElementById("stateSel");
  const label = document.getElementById("regionLabel");
  sel.innerHTML = "";
  
  let regions = currentCountry === "US" ? US_STATES : CN_PROVINCES;
  label.textContent = currentCountry === "US" ? "选择州：" : "选择省：";
  
  // 静态渲染所有选项，彻底解决下拉错乱
  regions.forEach(region => {
    const opt = document.createElement("option");
    opt.value = region.value;
    opt.textContent = region.name;
    sel.appendChild(opt);
  });
  
  // 默认选中第一个
  sel.value = regions[0].value;
  loadStateData();
}

// 加载地区数据
function loadStateData() {
  currentRegion = document.getElementById("stateSel").value;
  const regions = currentCountry === "US" ? US_STATES : CN_PROVINCES;
  const cfg = regions.find(r => r.value === currentRegion);
  
  if(!cfg) {
    alert("地区配置错误");
    return;
  }
  
  const loadingEl = document.getElementById("loading");
  loadingEl.style.display = "block";
  
  // 重置所有状态
  document.getElementById("resToday").innerHTML = "<div>数据加载中...</div>";
  document.getElementById("resForecast").innerHTML = "<div>数据加载中...</div>";
  document.getElementById("resUrban").innerHTML = "<div>数据加载中...</div>";
  document.getElementById("resUAV").innerHTML = "<div>数据加载中...</div>";
  document.getElementById("dateSel").disabled = true;
  document.querySelector("button").disabled = true;
  
  // 强制销毁旧图表
  if(chart) {
    chart.destroy();
    chart = null;
  }
  
  // 加载CSV
  Papa.parse(cfg.csv, {
    download: true,
    header: true,
    skipEmptyLines: true,
    timeout: 10000,
    complete: function(results) {
      try {
        // 过滤并排序数据
        rawData = results.data
          .filter(row => row.date && row.cases && !isNaN(+row.cases))
          .map(row => ({
            date: formatDate(row.date),
            totalCases: +row.cases
          }))
          .sort((a,b) => new Date(a.date) - new Date(b.date));
          
        if(rawData.length === 0) {
          throw new Error("CSV文件无有效数据");
        }
        
        calculateData(cfg);
        completeDataToToday();
        setDateRange();
        initChart(cfg);
        runQuery();
        loadingEl.style.display = "none";
      } catch(e) {
        alert("数据处理失败：" + e.message);
        loadingEl.style.display = "none";
      }
    },
    error: function(err) {
      alert("文件加载失败：" + cfg.csv + "，请检查文件名是否正确");
      loadingEl.style.display = "none";
    }
  });
}

// 计算Re指数
function calculateData(cfg) {
  const N = cfg.population;
  let S = N, I = 0;
  
  const dailyRaw = rawData.map((row, i) => ({
    date: row.date,
    newRaw: i > 0 ? row.totalCases - rawData[i-1].totalCases : row.totalCases
  }));
  
  // 7日平滑
  const smoothData = dailyRaw.map((row, i) => {
    let sum = 0, count = 0;
    const start = Math.max(0, i - 6);
    for(let j = start; j <= i; j++) {
      sum += dailyRaw[j].newRaw;
      count++;
    }
    return {...row, newSmooth: sum / count};
  });
  
  calcData = smoothData.map(row => {
    const beta = (I > 0 && S > 0) ? (row.newSmooth * N) / (I * S) : 0;
    const Rt = beta / COMMON_PARAMS.gamma;
    const Re = Rt * S / N;
    const recover = COMMON_PARAMS.gamma * I;
    S = Math.max(0, S - row.newSmooth);
    I = Math.max(0, I + row.newSmooth - recover);
    return {...row, S, I, beta, Rt, Re, N};
  });
  
  csvMinDate = calcData[0].date;
  csvMaxDate = calcData[calcData.length-1].date;
}

// 补全数据到今日
function completeDataToToday() {
  const today = getTodayDate();
  const lastDate = new Date(csvMaxDate);
  
  if(new Date(today) <= lastDate) {
    fullData = [...calcData];
    return;
  }
  
  const fillDates = generateDateRange(new Date(lastDate).setDate(lastDate.getDate()+1), today);
  const last = calcData[calcData.length-1];
  
  let currentRe = last.Re;
  const fillData = fillDates.map(date => {
    // 模拟平缓趋势
    currentRe += (Math.random() - 0.5) * 0.02;
    currentRe = Math.max(0.1, Math.min(2, currentRe));
    
    return {
      date: date,
      newRaw: last.newRaw * (0.95 + Math.random() * 0.1),
      newSmooth: last.newSmooth * (0.95 + Math.random() * 0.1),
      S: Math.max(0, last.S - Math.random() * 1000),
      I: Math.max(0, last.I + (Math.random() - 0.5) * 500),
      beta: last.beta * (0.98 + Math.random() * 0.04),
      Rt: currentRe * last.N / last.S,
      Re: currentRe,
      N: last.N
    };
  });
  
  fullData = [...calcData, ...fillData];
}

// 设置日期范围
function setDateRange() {
  const today = getTodayDate();
  document.getElementById("dateRangeText").textContent = 
    `数据日期范围：${csvMinDate} ~ ${today}（原始数据至 ${csvMaxDate}，后续为预测补全）`;
  
  const dateInput = document.getElementById("dateSel");
  dateInput.min = csvMinDate;
  dateInput.max = today;
  dateInput.value = today;
  dateInput.disabled = false;
  document.querySelector("button").disabled = false;
}

// 初始化图表
function initChart(cfg) {
  const ctx = document.getElementById("chartRe").getContext("2d");
  
  const labels = fullData.map(d => d.date);
  const reData = fullData.map(d => d.Re.toFixed(3));
  const warnLine = Array(labels.length).fill(COMMON_PARAMS.reWarnThreshold);
  
  const regionType = currentCountry === "CN" ? "省" : "州";
  
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        {
          label: `${cfg.name} Re指数(7日平滑)`,
          data: reData,
          borderColor: "#2E86AB",
          backgroundColor: "rgba(46, 134, 171, 0.2)",
          fill: true,
          tension: 0.4,
          borderWidth: 3,
          pointRadius: 0
        },
        {
          label: "预警阈值 Re=1.2",
          data: warnLine,
          borderColor: "#E63946",
          borderDash: [6, 3],
          borderWidth: 2,
          fill: false,
          pointRadius: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: 0,
          max: 3,
          title: {
            display: true,
            text: "Re指数 (有效再生数)"
          }
        },
        x: {
          ticks: {
            maxTicksLimit: 30
          }
        }
      },
      plugins: {
        title: {
          display: true,
          text: `${cfg.name} Re指数趋势图(含预测补全至今日)`
        }
      }
    }
  });
}

// 72小时预测
function predict72h(last) {
  let S = last.S, I = last.I;
  let newCases = 0;
  
  for(let i=0; i<3; i++) {
    const newI = last.beta * S * I / last.N;
    const rec = COMMON_PARAMS.gamma * I;
    newCases += newI;
    S = Math.max(0, S - newI);
    I = Math.max(0, I + newI - rec);
  }
  
  const nextRe = (last.beta / COMMON_PARAMS.gamma) * S / last.N;
  return { newCases, nextRe };
}

// 查询数据
function runQuery() {
  const date = document.getElementById("dateSel").value;
  const target = fullData.find(d => d.date === date) || fullData[fullData.length-1];
  const regions = currentCountry === "US" ? US_STATES : CN_PROVINCES;
  const cfg = regions.find(r => r.value === currentRegion);
  
  const forecast = predict72h(target);
  const warn = forecast.nextRe > COMMON_PARAMS.reWarnThreshold;
  
  const urbanI = target.I * (1 - cfg.rural);
  const ruralI = target.I * cfg.rural;
  const urbanRe = target.Re * 1.05;
  const ruralRe = target.Re * 0.95;
  const urbanWarn = urbanRe > COMMON_PARAMS.reWarnThreshold;
  const ruralWarn = ruralRe > COMMON_PARAMS.reWarnThreshold;
  
  const uavTip = ruralWarn ? "⚠️ 优先农村配送" : urbanWarn ? "⚠️ 优先城市配送" : "✅ 无需紧急配送";
  
  // 渲染数据
  document.getElementById("resToday").innerHTML = `
    <div><strong>查询日期：${date}</strong></div>
    <div>当日新增：${Math.round(target.newRaw)}</div>
    <div>Re指数：<span style="color:${target.Re>1.2?'red':'green'}">${target.Re.toFixed(2)}</span></div>
  `;
  
  document.getElementById("resForecast").innerHTML = `
    <div><strong>72小时预测 Re：${forecast.nextRe.toFixed(2)}</strong></div>
    <div>预测新增：${Math.round(forecast.newCases)}</div>
    <div>预警状态：${warn?'⚠️ 预警':'✅ 安全'}</div>
  `;
  
  document.getElementById("resUrban").innerHTML = `
    <div><strong>城市：Re=${urbanRe.toFixed(2)} ${urbanWarn?'⚠️':'✅'}</strong></div>
    <div><strong>农村：Re=${ruralRe.toFixed(2)} ${ruralWarn?'⚠️':'✅'}</strong></div>
  `;
  
  document.getElementById("resUAV").innerHTML = `
    <div><strong>无人机调度建议：${uavTip}</strong></div>
    <div>建议调度数量：${Math.ceil(target.I / 500)} 台</div>
  `;
}

// 页面初始化
window.onload = function() {
  // 绑定事件
  document.getElementById("countrySel").addEventListener("change", onCountryChange);
  document.getElementById("stateSel").addEventListener("change", loadStateData);
  
  // 初始化
  onCountryChange();
};
</script>
