<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM‑SIR 疫情监测系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", Arial, sans-serif;
}
body {
  background: #f5f7fa;
  padding: 24px;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
}
header {
  background: #165DFF;
  color: #fff;
  padding: 28px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 24px;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.form {
  display: flex;
  gap: 16px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
select, input[type="date"] {
  padding: 10px 14px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  font-size: 14px;
  min-width: 180px;
}
button {
  background: #165DFF;
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.full {
  grid-column: 1 / -1;
}
.item {
  padding: 14px;
  background: #f5f7fa;
  border-radius: 10px;
  margin: 10px 0;
  font-weight: bold;
}
.chart-container {
  position: relative;
  height: 500px;
  width: 100%;
}
.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>RM‑SIR 疫情指数监测与无人机干预调度系统</h1>
    <p id="dateRangeText">数据加载中...</p>
  </header>

  <div class="card">
    <div class="form">
      <label>选择国家：</label>
      <select id="countrySel" onchange="onCountryChange()">
        <option value="US">美国</option>
        <option value="CN">中国</option>
      </select>

      <label id="regionLabel">选择州：</label>
      <select id="stateSel" onchange="loadStateData()"></select>

      <label>选择日期：</label>
      <input type="date" id="dateSel" disabled>
      <button onclick="runQuery()" disabled>查询数据</button>
    </div>

    <div id="loading" class="loading">加载中...</div>

    <div id="resultContainer" class="grid">
      <div class="card"><div id="resToday" class="item">加载中...</div></div>
      <div class="card"><div id="resForecast" class="item">加载中...</div></div>
      <div class="card"><div id="resUrban" class="item">加载中...</div></div>
      <div class="card"><div id="resUAV" class="item">加载中...</div></div>
      <div class="card full chart-container">
        <canvas id="chartRe"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const COUNTRY_CONFIG = {
  CN: {
    name: "中国",
    regions: {
      Guangdong: { name: "广东省", population: 126000000, csvFileName: "Guangdong_data.csv", ruralRatio: 0.25 }
    }
  },
  US: {
    name: "美国",
    regions: {
      Ohio: { population:11700000, csvFileName:"ohio_data.csv", ruralRatio:0.2 },
      Alabama: { population:5024279, csvFileName:"Alabama_data.csv", ruralRatio:0.35 },
      Alaska: { population:733583, csvFileName:"Alaska_data.csv", ruralRatio:0.65 },
      Arizona: { population:7379654, csvFileName:"Arizona_data.csv", ruralRatio:0.28 },
      Arkansas: { population:3045637, csvFileName:"Arkansas_data.csv", ruralRatio:0.48 },
      California: { population:39538223, csvFileName:"California_data.csv", ruralRatio:0.15 },
      Colorado: { population:5893634, csvFileName:"Colorado_data.csv", ruralRatio:0.32 },
      Connecticut: { population:3605944, csvFileName:"Connecticut_data.csv", ruralRatio:0.18 },
      Delaware: { population:1003384, csvFileName:"Delaware_data.csv", ruralRatio:0.22 },
      Florida: { population:21538187, csvFileName:"Florida_data.csv", ruralRatio:0.14 },
      Georgia: { population:10711908, csvFileName:"Georgia_data.csv", ruralRatio:0.24 },
      Hawaii: { population:1455271, csvFileName:"Hawaii_data.csv", ruralRatio:0.21 },
      Idaho: { population:1900923, csvFileName:"Idaho_data.csv", ruralRatio:0.58 },
      Illinois: { population:12812508, csvFileName:"Illinois_data.csv", ruralRatio:0.19 },
      Indiana: { population:6833037, csvFileName:"Indiana_data.csv", ruralRatio:0.31 },
      Iowa: { population:3190369, csvFileName:"Iowa_data.csv", ruralRatio:0.52 },
      Kansas: { population:2937150, csvFileName:"Kansas_data.csv", ruralRatio:0.45 },
      Kentucky: { population:4509342, csvFileName:"Kentucky_data.csv", ruralRatio:0.41 },
      Louisiana: { population:4657757, csvFileName:"Louisiana_data.csv", ruralRatio:0.34 },
      Maine: { population:1372247, csvFileName:"Maine_data.csv", ruralRatio:0.61 },
      Maryland: { population:6177224, csvFileName:"Maryland_data.csv", ruralRatio:0.17 },
      Massachusetts: { population:7029917, csvFileName:"Massachusetts_data.csv", ruralRatio:0.13 },
      Michigan: { population:10077331, csvFileName:"Michigan_data.csv", ruralRatio:0.29 },
      Minnesota: { population:5707390, csvFileName:"Minnesota_data.csv", ruralRatio:0.40 },
      Mississippi: { population:2966407, csvFileName:"Mississippi_data.csv", ruralRatio:0.49 },
      Missouri: { population:6169270, csvFileName:"Missouri_data.csv", ruralRatio:0.36 },
      Montana: { population:1122867, csvFileName:"Montana_data.csv", ruralRatio:0.69 },
      Nebraska: { population:1963692, csvFileName:"Nebraska_data.csv", ruralRatio:0.53 },
      Nevada: { population:3104614, csvFileName:"Nevada_data.csv", ruralRatio:0.33 },
      Oklahoma: { population:3959353, csvFileName:"Oklahoma_data.csv", ruralRatio:0.43 },
      Oregon: { population:4237256, csvFileName:"Oregon_data.csv", ruralRatio:0.39 },
      Pennsylvania: { population:12801989, csvFileName:"Pennsylvania_data.csv", ruralRatio:0.21 },
      Tennessee: { population:6910840, csvFileName:"Tennessee_data.csv", ruralRatio:0.30 },
      Texas: { population:29145505, csvFileName:"Texas_data.csv", ruralRatio:0.18 },
      Utah: { population:3380800, csvFileName:"Utah_data.csv", ruralRatio:0.35 },
      Vermont: { population:643077, csvFileName:"Vermont_data.csv", ruralRatio:0.56 },
      Virginia: { population:8631393, csvFileName:"Virginia_data.csv", ruralRatio:0.23 },
      Washington: { population:7705281, csvFileName:"Washington_data.csv", ruralRatio:0.25 },
      Wisconsin: { population:5893718, csvFileName:"Wisconsin_data.csv", ruralRatio:0.37 },
      Wyoming: { population:578803, csvFileName:"Wyoming_data.csv", ruralRatio:0.72 },
      NewHampshire: { population:1388992, csvFileName:"NewHampshire_data.csv", ruralRatio:0.42 },
      NewJersey: { population:9288994, csvFileName:"NewJersey_data.csv", ruralRatio:0.11 },
      NewMexico: { population:2117522, csvFileName:"NewMexico_data.csv", ruralRatio:0.54 },
      NewYork: { population:20201249, csvFileName:"NewYork_data.csv", ruralRatio:0.12 },
      NorthCarolina: { population:10439388, csvFileName:"NorthCarolina_data.csv", ruralRatio:0.26 },
      NorthDakota: { population:779261, csvFileName:"NorthDakota_data.csv", ruralRatio:0.63 },
      RhodeIsland: { population:1097379, csvFileName:"RhodeIsland_data.csv", ruralRatio:0.20 },
      SouthCarolina: { population:5210095, csvFileName:"SouthCarolina_data.csv", ruralRatio:0.27 },
      SouthDakota: { population:909824, csvFileName:"SouthDakota_data.csv", ruralRatio:0.62 },
      WestVirginia: { population:1782959, csvFileName:"WestVirginia_data.csv", ruralRatio:0.51 },
      DistrictOfColumbia: { population:712816, csvFileName:"districtofcolumbia_data.csv", ruralRatio:0 }
    }
  }
};

const COMMON_PARAMS = { gamma:0.2, reWarnThreshold:1.2 };
let currentCountry = "US", currentRegion = "Ohio";
let rawData = [], calcData = [], fullData = [], chart = null;
let csvMinDate = "", csvMaxDate = "";

function formatDate(d) {
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getTodayDate() { return formatDate(new Date()); }

function onCountryChange() {
  currentCountry = document.getElementById("countrySel").value;
  const sel = document.getElementById("stateSel");
  sel.innerHTML = "";
  const regions = COUNTRY_CONFIG[currentCountry].regions;
  for(let k in regions) {
    const opt = document.createElement("option");
    opt.value = k; opt.textContent = regions[k].name;
    sel.appendChild(opt);
  }
  document.getElementById("regionLabel").textContent = currentCountry==="CN" ? "选择省：" : "选择州：";
  loadStateData();
}

function loadStateData() {
  currentRegion = document.getElementById("stateSel").value;
  const cfg = COUNTRY_CONFIG[currentCountry].regions[currentRegion];
  const file = cfg.csvFileName;
  document.getElementById("loading").style.display = "block";
  document.getElementById("dateSel").disabled = true;
  document.querySelector("button").disabled = true;

  Papa.parse(file, { download:true, header:true, skipEmptyLines:true,
    complete(r) {
      const valid = r.data.filter(x=>x.date&&x.cases).map(x=>({
        date:formatDate(x.date), totalCases:+x.cases
      })).sort((a,b)=>new Date(a.date)-new Date(b.date));
      rawData = valid;
      calculateData(cfg);
      completeDataToToday();
      setDateRange();
      initChart(cfg);
      runQuery();
      document.getElementById("loading").style.display = "none";
    }
  });
}

function calculateData(cfg) {
  const N = cfg.population;
  let S = N, I=0;
  const daily = rawData.map((r,i)=>({
    date:r.date, newRaw:i>0?r.totalCases-rawData[i-1].totalCases:r.totalCases
  }));
  calcData = daily.map(r=>{
    const smooth = r.newRaw;
    const beta = I&&S ? (smooth*N)/(I*S) : 0;
    const Rt = beta/COMMON_PARAMS.gamma;
    const Re = Rt*S/N;
    const rec = COMMON_PARAMS.gamma*I;
    S = Math.max(0, S-smooth);
    I = Math.max(0, I+smooth-rec);
    return {...r, newSmooth:smooth, S,I,beta,Rt,Re,N};
  });
  csvMinDate = calcData[0]?.date;
  csvMaxDate = calcData[calcData.length-1]?.date;
}

function completeDataToToday() { fullData = [...calcData]; }

function setDateRange() {
  const today = getTodayDate();
  document.getElementById("dateRangeText").textContent = `数据范围：${csvMinDate} ~ ${today}`;
  const ipt = document.getElementById("dateSel");
  ipt.min = csvMinDate; ipt.max = today; ipt.value = today;
  ipt.disabled = false; document.querySelector("button").disabled = false;
}

function initChart(cfg) {
  const ctx = document.getElementById("chartRe").getContext("2d");
  if(chart) chart.destroy();
  const labels = fullData.map(d=>d.date);
  const re = fullData.map(d=>d.Re);
  chart = new Chart(ctx,{
    type:'line',
    data:{
      labels, datasets:[
        { label:"Re指数", data:re, borderColor:"#165DFF", borderWidth:3, fill:true, tension:0.3 },
        { label:"预警线(1.2)", data:Array(labels.length).fill(1.2), borderColor:"red", borderDash:[5,5], borderWidth:2 }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false }
  });
}

function runQuery() {
  const date = document.getElementById("dateSel").value;
  const d = fullData.find(x=>x.date===date);
  if(!d) return;
  const cfg = COUNTRY_CONFIG[currentCountry].regions[currentRegion];
  const urban = d.I*(1-cfg.ruralRatio);
  const rural = d.I*cfg.ruralRatio;

  document.getElementById("resToday").innerHTML = `
  日期：${date}<br>新增：${Math.round(d.newSmooth)}<br>Re：${d.Re.toFixed(3)}`;
  document.getElementById("resForecast").innerHTML = `72小时预测：持续更新`;
  document.getElementById("resUrban").innerHTML = `城市：${Math.round(urban)} 人<br>农村：${Math.round(rural)} 人`;
  document.getElementById("resUAV").innerHTML = `建议无人机：${Math.ceil(d.I/500)} 台`;
}

window.onload = function(){
  onCountryChange();
};
</script>
</body>
</html>
