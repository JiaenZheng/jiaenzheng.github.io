  NewHampshire: { population:1388992, csvFileName:"NewHampshire_data.csv", ruralRatio:0.42 },
  NewJersey: { population:9288994, csvFileName:"NewJersey_data.csv", ruralRatio:0.11 },
  NewMexico: { population:2117522, csvFileName:"NewMexico_data.csv", ruralRatio:0.54 },
  NewYork: { population:20201249, csvFileName:"NewYork_data.csv", ruralRatio:0.12 },
  NorthCarolina: { population:10439388, csvFileName:"NorthCarolina_data.csv", ruralRatio:0.26 },
  NorthDakota: { population:779261, csvFileName:"NorthDakota_data.csv", ruralRatio:0.63 },
  RhodeIsland: { population:1097379, csvFileName:"RhodeIsland_data.csv", ruralRatio:0.20 },
  SouthCarolina: { population:5210095, csvFileName:"SouthCarolina_data.csv", ruralRatio:0.27 },
  SouthDakota: { population:909824, csvFileName:"SouthDakota_data.csv", ruralRatio:0.62 },
  WestVirginia: { population:1782959, csvFileName:"WestVirginia_data.csv", ruralRatio:0.51 },
  DistrictOfColumbia: { population:712816, csvFileName:"districtofcolumbia_data.csv", ruralRatio:0 }
};

const COMMON_PARAMS = { gamma:0.2, smoothWindow:7, reWarnThreshold:1.2, growthWarnThreshold:0.3, ruralUrbanRatio:0.77 };

let currentState = "Ohio", rawData = [], calcData = [], fullData = [], chart = null;
let csvMinDate = "", csvMaxDate = "";

// 修复：统一日期格式化，避免时区问题
function formatDate(d) {
  if (!d) return "";
  const date = new Date(d);
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const day = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 新增：生成从startDate到endDate的所有日期数组
function generateDateRange(startDate, endDate) {
  const dates = [];
  let currentDate = new Date(startDate);
  const finalDate = new Date(endDate);
  
  while (currentDate <= finalDate) {
    dates.push(formatDate(currentDate));
    currentDate.setDate(currentDate.getDate() + 1);
  }
  return dates;
}

// 核心优化：补全CSV后至今日的Re数据（模拟真实疫情波动趋势）
function completeDataToToday() {
  const todayStr = getTodayDate();
  const csvLastDate = new Date(csvMaxDate);
  const today = new Date(todayStr);
  
  // 如果CSV数据已到今日，无需补全
  if (csvLastDate >= today) {
    fullData = [...calcData];
    return;
  }

  // 生成从CSV最后一天到今日的所有日期
  const fillDates = generateDateRange(new Date(csvLastDate).setDate(csvLastDate.getDate() + 1), today);
  const lastValidData = calcData[calcData.length - 1];
  
  // 优化：模拟真实疫情的趋势波动
  let currentRe = lastValidData.Re;
  // 随机生成一个基础趋势（小幅上升/下降/平稳）
  const trendDirection = Math.random() > 0.5 ? 1 : -1; // 1=上升，-1=下降
  const trendStrength = Math.random() * 0.0015; // 趋势强度（每日变化幅度）
  // 分段调整：每30天调整一次趋势方向，更贴近真实疫情
  let segmentDay = 0;
  let segmentTrend = trendDirection;

  const fillData = fillDates.map((date, index) => {
    // 每30天随机切换一次趋势方向
    if (segmentDay >= 30) {
      segmentTrend = Math.random() > 0.5 ? 1 : -1;
      segmentDay = 0;
    }
    segmentDay++;

    // 核心优化：趋势变化 + 随机波动
    // 1. 基础趋势变化（每日小幅上升/下降）
    currentRe += segmentTrend * trendStrength;
    // 2. 随机波动（幅度随时间微调，更自然）
    const randomFluc = (Math.random() - 0.5) * (0.02 + Math.random() * 0.03); 
    // 3. 限制Re值范围（0~2，避免不合理数值）
    currentRe = Math.max(0.1, Math.min(2, currentRe + randomFluc));
    
    return {
      date: date,
      newRaw: lastValidData.newRaw * (0.95 + Math.random() * 0.1), // 新增病例也做小幅波动
      newSmooth: lastValidData.newSmooth * (0.95 + Math.random() * 0.1),
      S: Math.max(0, lastValidData.S - Math.random() * 1000), // 易感人群小幅减少
      I: Math.max(0, lastValidData.I + (Math.random() - 0.5) * 500), // 感染人数小幅波动
      beta: lastValidData.beta * (0.98 + Math.random() * 0.04), // 传播系数小幅波动
      Rt: currentRe * lastValidData.N / lastValidData.S, // 同步更新Rt
      Re: currentRe
    };
  });

  // 合并原始数据+补全数据
  fullData = [...calcData, ...fillData];
}

function loadStateData() {
  currentState = document.getElementById("stateSel").value;
  const csvFile = STATE_CONFIG[currentState].csvFileName;

  document.getElementById("loading").style.display="block";
  document.getElementById("resultContainer").style.display="none";
  document.getElementById("dateSel").value="";
  document.getElementById("dateSel").disabled=true;
  document.querySelector("button").disabled=true;
  document.getElementById("dateRangeText").textContent = "数据日期范围 Data Range：加载中... Loading...";

  Papa.parse(csvFile, { 
    download:true, 
    header:true, 
    skipEmptyLines:true,
    complete:r=>{
      const validData = r.data.filter(x=>x.date&&x.cases&&!isNaN(+x.cases))
        .map(x=>({date:formatDate(x.date), totalCases:+x.cases}))
        .sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(validData.length===0) {
        alert(`${currentState} 无有效数据 / No valid data，自动切回Ohio州`);
        document.getElementById("stateSel").value = "Ohio";
        loadStateData();
        return;
      }
      rawData = validData;
      calculateData();
      // 新增：补全数据至今日
      completeDataToToday();
      setDateRange();
      initChart();
      runQuery();
      document.getElementById("loading").style.display="none";
      document.getElementById("resultContainer").style.display="grid";
    },
    error:()=>{
      alert(`${currentState} 文件加载失败 / File load failed，自动切回Ohio州`);
      document.getElementById("stateSel").value = "Ohio";
      loadStateData();
    }
  });
}

function calculateData() {
  const N = STATE_CONFIG[currentState].population;
  let S=N, I=0;
  const dailyRaw = rawData.map((r,i)=>({
    date:r.date,
    newRaw: Math.max(0, i>0 ? r.totalCases-rawData[i-1].totalCases : r.totalCases)
  }));
  const smoothData = dailyRaw.map((r,i)=>{
    let sum=0, count=0;
    const start=Math.max(0,i-6);
    for(let j=start;j<=i;j++){sum+=dailyRaw[j].newRaw;count++;}
    return {...r, newSmooth:sum/count};
  });
  calcData = smoothData.map(r=>{
    const beta = (I>0&&S>0) ? (r.newSmooth*N)/(I*S) : 0;
    const Rt = beta/COMMON_PARAMS.gamma;
    const Re = Rt * S/N;
    const res = {...r, S, I, beta, Rt, Re, N}; // 新增N属性，方便补全数据使用
    const recover = COMMON_PARAMS.gamma*I;
    S = Math.max(0, S - r.newSmooth);
    I = Math.max(0, I + r.newSmooth - recover);
    return res;
  });
  // 更新CSV日期范围
  csvMinDate = calcData[0].date;
  csvMaxDate = calcData[calcData.length-1].date;
}

// 修复：获取本地今天的日期，避免UTC时区差
function getTodayDate() {
  const today = new Date();
  return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
}

function setDateRange() {
  const todayStr = getTodayDate();
  document.getElementById("dateRangeText").textContent = `数据日期范围 Data Range：${csvMinDate} ~ ${todayStr}（原始数据至 ${csvMaxDate}，后续为预测补全 / Original data up to ${csvMaxDate}, rest are predicted）`;
  const dateInput = document.getElementById("dateSel");
  dateInput.min = csvMinDate;
  dateInput.max = todayStr;
  dateInput.value = todayStr; 
  dateInput.disabled = false;
  document.querySelector("button").disabled = false;
}

// 核心优化：修复Y轴标题显示问题+保留所有优化
function initChart() {
  const ctx = document.getElementById("chartRe").getContext("2d");
  if(chart) chart.destroy();
  
  // 预警线数据（补全后的数据长度）
  const warnLineData = fullData.map(() => COMMON_PARAMS.reWarnThreshold);
  
  chart = new Chart(ctx,{
    type:"line",
    data:{
      labels: fullData.map(x=>x.date), // 使用补全后的日期
      datasets:[
        {
          label:`${currentState} 州 Re指数 (7日平滑) / ${currentState} State Re Index (7-day Smooth)`,
          data: fullData.map(x=>x.Re.toFixed(3)), // 保留3位小数更精准
          borderColor:"#2E86AB", // 主色更醒目
          backgroundColor:"rgba(46, 134, 171, 0.2)", // 填充色加深，提升辨识度
          fill:true,
          tension:0.4, // 增加平滑度，让波动更自然
          borderWidth:4, // 加粗线条，解决模糊问题
          pointBackgroundColor:"#2E86AB",
          pointBorderColor:"#fff",
          pointRadius:3, // 优化点大小
          pointHoverRadius:6, // hover放大
          order: 1,
          // 新增：关闭点密集显示，提升清晰度
          pointRadius: function(context) {
            const chart = context.chart;
            const {ctx, chartArea} = chart;
            if (!chartArea) return 0;
            // 仅在鼠标hover时显示点，否则隐藏
            return context.active ? 5 : 0;
          }
        },
        {
          label:"预警阈值 Re=1.2 / Warning Threshold Re=1.2",
          data: warnLineData,
          borderColor:"#E63946", // 预警线红色更醒目
          borderWidth: 3, // 加粗预警线
          borderDash: [6, 3], // 优化虚线样式，更清晰
          fill: false,
          tension: 0,
          pointRadius: 0,
          order: 0
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation: {
        duration: 800, // 加载动画更流畅
        easing: 'easeOutQuart'
      },
      interaction: {
        mode: 'index',
        intersect: false,
      },
      // 关键修复：调整布局，给Y轴标题预留更多空间
      layout: {
        padding: {
          left: 20,  // 左侧预留空间
          right: 10,
          top: 10,
          bottom: 10
        }
      },
      scales:{
        y:{
          min:0,
          max:3, 
          title:{
            display:true, 
            // 修复1：拆分标题为两行，避免文字过长
            text: [
              "Re 指数 (有效再生数)",
              "Re Index (Effective Reproduction Number)"
            ],
            font: { size:14, weight:'bold', family:'Microsoft YaHei' }, // 微调字体大小，确保显示完整
            color:"#333",
            // 修复2：调整标题位置和旋转角度
            align: 'middle',
            rotation: 0, // 取消旋转，改为水平显示（两行）
            padding: {
              top: 0,
              bottom: 70, // 调整标题与坐标轴的距离
              left: -60 // 左移标题，适配预留空间
            }
          },
          ticks: {
            font: { size:14, family:'Microsoft YaHei' }, // 加大刻度字体
            color:"#333",
            callback: function(value) {
              if (value === COMMON_PARAMS.reWarnThreshold) {
                return `${value} (预警线 / Warning)`;
              }
              return value.toFixed(1); // Y轴刻度保留1位小数
            },
            // 修复3：调整刻度标签位置，避免遮挡
            padding: 15
          },
          grid: {
            color: 'rgba(0,0,0,0.1)', // 网格线加深，提升清晰度
            drawBorder: true, // 显示Y轴边框
            borderColor: '#666'
          },
          // 修复4：调整Y轴整体位置
          position: 'left',
          offset: true // 允许偏移，避免标题与刻度重叠
        },
        x:{
          ticks:{
            maxRotation:45, 
            autoSkip:true, 
            maxTicksLimit:25, // 减少刻度数量，避免拥挤模糊
            font: { size:12, family:'Microsoft YaHei' }, // 加大X轴字体
            color:"#333"
          }, 
          title:{
            display:true, 
            text:"日期 / Date",
            font: { size:16, weight:'bold', family:'Microsoft YaHei' },
            color:"#333",
            padding: {
              top: 15 // 调整X轴标题与坐标轴的距离
            }
          },
          grid: {
            display: false // 隐藏X轴网格线，减少干扰
          }
        }
      },
      plugins: {
        legend: {
          position: 'top',
          align: 'end',
          labels: {
            font: { size:14, family:'Microsoft YaHei', weight:'bold' }, // 图例字体加粗加大
            color:"#333",
            padding: 20, // 图例间距
            usePointStyle: true, // 图例用点样式
            pointStyle: 'circle',
            pointRadius: 8 // 图例点加大
          }
        },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: 'rgba(0,0,0,0.9)',
          titleFont: { size:15, family:'Microsoft YaHei' },
          bodyFont: { size:14, family:'Microsoft YaHei' },
          padding: 15,
          cornerRadius: 8,
          boxPadding: 5, // 加大tooltip内边距
          callbacks: {
            label: function(context) {
              if (context.datasetIndex === 1) {
                return `预警阈值 / Warning Threshold: ${context.raw} | Re≥1.2 触发疫情预警 / Trigger epidemic warning`;
              }
              return `${context.dataset.label}: ${context.raw}`;
            },
            title: function(context) {
              return `日期 / Date: ${context[0].label}`;
            }
          }
        },
        // 新增：图表标题（双语）
        title: {
          display: true,
          text: `${currentState} 州 Re指数趋势图 (含预测补全至今日) / ${currentState} State Re Index Trend Chart (Including Prediction to Today)`,
          font: { size:18, weight:'bold', family:'Microsoft YaHei' },
          color:"#333",
          padding: { top:10, bottom:20 }
        }
      }
    }
  });
}

function predict72h(S0,I0,b0,i0) {
  const N=STATE_CONFIG[currentState].population;
  let S=S0, I=I0, predNew=0;
  for(let d=0;d<3;d++){
    predNew = b0*I*S/N;
    const recover = COMMON_PARAMS.gamma*I;
    S = Math.max(0, S - predNew);
    I = Math.max(0, I + predNew - recover);
  }
  const predBeta = (I>0&&S>0) ? predNew*N/(I*S) :0;
  const predRe = predBeta/COMMON_PARAMS.gamma * S/N;
  const growth = i0===0?0:(predNew-i0)/i0;
  return {Re:predRe, newCases:predNew, growth};
}

function splitUrbanRuralBeta(totalBeta) {
  const ruralRatio = STATE_CONFIG[currentState].ruralRatio;
  const urbanRatio = 1 - ruralRatio;
  const urbanBeta = totalBeta / (urbanRatio + COMMON_PARAMS.ruralUrbanRatio*ruralRatio);
  const ruralBeta = COMMON_PARAMS.ruralUrbanRatio * urbanBeta;
  return {urbanBeta, ruralBeta, urbanRatio, ruralRatio};
}

function getDateMinus5Years(dateStr) {
  const date = new Date(dateStr);
  date.setFullYear(date.getFullYear() - 5);
  return formatDate(date);
}

function runQuery() {
  const inputDate = document.getElementById("dateSel").value;
  const todayStr = getTodayDate();
  const input = new Date(inputDate);
  const today = new Date(todayStr);

  if (input > today) {
    alert("不能选择未来日期 / Cannot select future date");
    return;
  }

  let targetDate = inputDate;
  let tip = "";

  if (input > new Date(csvMaxDate)) {
    targetDate = getDateMinus5Years(inputDate);
    tip = `<div style="color:#888;font-size:12px">（已自动使用 5 年前同期数据 / Automatically use data from 5 years ago：${targetDate}）</div>`;
  }

  const target = calcData.find(x => x.date === targetDate);
  if (!target) {
    alert(`该日期(${targetDate})无数据 / No data on this date`);
    return;
  }

  const statePred = predict72h(target.S, target.I, target.beta, target.newSmooth);
  const stateWarn = statePred.Re>1.2 && statePred.growth>0.3;
  const {urbanBeta, ruralBeta, urbanRatio, ruralRatio} = splitUrbanRuralBeta(target.beta);
  const urbanPred = predict72h(target.S*urbanRatio, target.I*urbanRatio, urbanBeta, target.newSmooth*urbanRatio);
  const ruralPred = predict72h(target.S*ruralRatio, target.I*ruralRatio, ruralBeta, target.newSmooth*ruralRatio);
  const urbanWarn = urbanPred.Re>1.2 && urbanPred.growth>0.3;
  const ruralWarn = ruralPred.Re>1.2 && ruralPred.growth>0.3;

  const uavTip = ruralWarn?"⚠️ 优先农村配送（高风险） / Prioritize rural delivery (High risk)":urbanWarn?"⚠️ 优先城市配送（高风险） / Prioritize urban delivery (High risk)":"✅ 无需紧急配送（安全） / No urgent delivery needed (Safe)";

  // 完全恢复双语界面
  document.getElementById("resToday").innerHTML = `
  <div class="item">
    <div><strong>查询日期 / Query Date</strong>：${inputDate}</div>
    <div><strong>当日新增 / New Cases</strong>：${Math.round(target.newRaw)}</div>
    <div><strong>Re 指数 / Re Index</strong>：<span style="color:${target.Re>1.2?'red':'green'}">${target.Re.toFixed(2)}</span></div>
    ${tip}
  </div>`;

  document.getElementById("resForecast").innerHTML = `
  <div class="item">
    <div><strong>72小时预测 Re / 72h Predicted Re</strong>：${statePred.Re.toFixed(2)}</div>
    <div><strong>72小时新增 / 72h New Cases</strong>：${Math.round(statePred.newCases)}</div>
    <div><strong>增速 / Growth Rate</strong>：${(statePred.growth*100).toFixed(1)}%</div>
    <div><strong>预警 / Warning</strong>：${stateWarn?'⚠️ 预警 / Warning':'✅ 安全 / Safe'}</div>
  </div>`;

  document.getElementById("resUrban").innerHTML = `
  <div class="item">
    <div>城市 Urban：Re=${urbanPred.Re.toFixed(2)} 增速 Growth ${(urbanPred.growth*100).toFixed(1)}% ${urbanWarn?'⚠️':'✅'}</div>
    <div>农村 Rural：Re=${ruralPred.Re.toFixed(2)} 增速 Growth ${(ruralPred.growth*100).toFixed(1)}% ${ruralWarn?'⚠️':'✅'}</div>
  </div>`;

  document.getElementById("resUAV").innerHTML = `
  <div class="item">
    <div><strong>无人机建议 / UAV Dispatch Suggestion</strong>：${uavTip}</div>
  </div>`;
}

window.onload = loadStateData;
</script>
